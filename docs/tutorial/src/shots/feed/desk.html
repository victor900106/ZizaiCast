<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1600px;height:900px;font-family:"Segoe UI","Microsoft JhengHei UI",sans-serif;background:linear-gradient(135deg,#3b5f8a,#7aa6c8 60%,#c9dbe8)}
.win{position:absolute;left:300px;top:110px;width:1000px;height:600px;background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
.tb{height:44px;background:#f3f3f3;display:flex;align-items:center;padding:0 18px;font-size:18px;color:#333;border-bottom:1px solid #ddd}
.doc{padding:34px 50px;font-size:30px;line-height:1.7;color:#222}
.task{position:absolute;left:0;right:0;bottom:0;height:56px;background:rgba(240,240,245,.85);display:flex;justify-content:center;gap:14px;align-items:center}
.task div{width:38px;height:38px;border-radius:8px;background:#5b8bd0}.task div:nth-child(2){background:#e8a33c}.task div:nth-child(3){background:#6fb98f}
.ic{position:absolute;left:30px;width:70px;height:70px;border-radius:12px;background:rgba(255,255,255,.6)}
</style></head><body>
<div class="ic" style="top:30px"></div><div class="ic" style="top:130px"></div><div class="ic" style="top:230px"></div>
<div class="win"><div class="tb">Document.txt</div><div class="doc">Shopping list<br>• Milk<br>• Bread<br>• Apples<br><br>Call the dentist on Monday</div></div>
<div class="task"><div></div><div></div><div></div><div></div></div>
</body></html>
