<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:720px;height:1560px;background:linear-gradient(#FBF7F2,#F1ECE6);font-family:"Yu Gothic UI","Meiryo",sans-serif;color:#222}
.bar{height:70px;display:flex;justify-content:space-between;align-items:center;padding:0 40px;font-size:28px;font-weight:600}
.app{margin:20px 36px;background:#fff;border-radius:36px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:44px 44px 50px}
h1{font-size:54px;margin:0 0 10px} .sub{font-size:28px;color:#888;margin-bottom:34px}
.row{display:flex;gap:24px;align-items:center;padding:26px 0;border-top:2px solid #eee;font-size:34px}
.ic{width:84px;height:84px;border-radius:24px;flex:none}
.big{font-size:40px;line-height:1.45;margin:30px 0 0}
.btn{margin-top:40px;background:#E86A5A;color:#fff;border-radius:999px;text-align:center;font-size:36px;font-weight:700;padding:26px}
.dock{position:absolute;bottom:40px;left:60px;right:60px;height:150px;border-radius:50px;background:rgba(255,255,255,.7);display:flex;justify-content:space-around;align-items:center}
.dock div{width:100px;height:100px;border-radius:28px}
</style></head><body>
<div class="bar"><span>9:41</span><span>Wi-Fi 100%</span></div>
<div class="app">
<h1>週末マーケット</h1><div class="sub">土曜日 午前10時～午後4時</div>
<div class="row"><div class="ic" style="background:#F6C85F"></div>焼きたてのパンとコーヒー</div>
<div class="row"><div class="ic" style="background:#6FB98F"></div>地元の果物と野菜</div>
<div class="row"><div class="ic" style="background:#7AA6E0"></div>正午からライブ演奏</div>
<p class="big">駅の裏に無料駐車場があります。買い物袋をお持ちください。</p>
<div class="btn">道順を見る</div>
</div>
<div class="dock"><div style="background:#E86A5A"></div><div style="background:#6FB98F"></div><div style="background:#7AA6E0"></div><div style="background:#F6C85F"></div></div>
</body></html>
