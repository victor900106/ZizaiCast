<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="自在遠端">
<title>Remote</title>
<style>
:root{--bg:#1E1416;--fg:#F6E9EA;--ac:#F5A7A7;--panel:rgba(30,20,22,.94);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font:15px/1.4 -apple-system,system-ui,"Microsoft JhengHei","Hiragino Sans","Apple SD Gothic Neo",sans-serif;
  overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transform-origin:50% 50%}
/* 外網連結 when WebRTC cannot connect: H.264 over the tunnel, decoded with WebCodecs onto this canvas */
#scr{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transform-origin:50% 50%;display:none}
/* which path the picture takes (直連 / 隧道) and the round trip, top right */
#path{position:absolute;right:calc(6px + var(--sr));top:calc(6px + var(--st));z-index:4;padding:3px 9px;border-radius:12px;background:rgba(0,0,0,.6);
  font-size:12px;display:none;white-space:nowrap;pointer-events:none}
#path.tun{color:#ffd9a0}
/* 通行碼 (外網連結) */
#pass{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);
  padding:24px calc(24px + var(--sr)) calc(24px + var(--sb)) calc(24px + var(--sl));text-align:center}
#passT{font-size:21px;font-weight:600}
#passS{font-size:16px;opacity:.8;max-width:420px}
/* 0.8.3.3: the fixed link's two kinds of login (owner: the password only; 臨時帳號: the account, often from the address) */
#userRow{font-size:16px;display:none;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
#userRow b{font-size:18px;color:var(--ac)}
.lnk{border:0;background:none;color:var(--ac);font-size:15px;text-decoration:underline;padding:6px 4px}
#pwEye{display:none}#pass.pw #pwEye{display:inline-block}
#passIn{font:600 30px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:10px;width:min(270px,82vw);text-align:center;padding:10px 6px 10px 16px;border-radius:12px;
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:var(--fg);-webkit-user-select:text;user-select:text;touch-action:auto}
#passGo{flex:0 0 auto;min-width:140px;background:var(--ac);color:#2a1a1c;border:0;font-weight:600}
#passErr{font-size:14px;color:#ffb3b3;min-height:20px}
#pass.pw #passIn,#userIn{letter-spacing:normal;font:500 20px/1.3 system-ui,sans-serif;padding:12px 14px;width:min(320px,86vw);text-align:center;border-radius:12px;
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:var(--fg);-webkit-user-select:text;user-select:text;touch-action:auto}
#pad{position:absolute;inset:0;z-index:2}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#hud{position:absolute;left:calc(6px + var(--sl));top:calc(6px + var(--st));z-index:3;padding:4px 8px;background:rgba(0,0,0,.62);border-radius:8px;
  font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;pointer-events:none;display:none;max-width:calc(100% - 12px);overflow:hidden}
/* toolbar: small round icon buttons, bottom right (thumb reach), never over the middle */
#bar{position:absolute;right:calc(8px + var(--sr));bottom:calc(24px + var(--sb));z-index:4;display:flex;gap:14px;align-items:center}
.ib{position:relative;width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:rgba(20,20,20,.62);display:flex;align-items:center;justify-content:center;padding:0}
/* 0.8.3.3: a word under every icon (聲音 / 放大 / 檔案 / 鍵盤 / 設定); the muted speaker says 開聲音 */
.ib .bl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-size:11px;line-height:1.2;white-space:nowrap;color:#fff;
  text-shadow:0 1px 2px #000,0 0 4px #000;pointer-events:none}
.ib .bl.call{color:var(--ac);font-weight:700}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--ac);border-color:var(--ac)}.ib.on svg{stroke:#2a1a1c}
#bar .ib{transition:opacity .4s}
#bar.dim .ib{opacity:.35}

#silent{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100% - 24px);bottom:calc(84px + var(--sb));z-index:4;padding:6px 14px;border-radius:14px;
  background:rgba(0,0,0,.66);font-size:13px;display:none;text-align:center;pointer-events:none}
body.sheet-open #silent{display:none!important}
#badge{position:absolute;left:50%;transform:translateX(-50%);top:calc(6px + var(--st));z-index:4;padding:3px 10px;border-radius:12px;background:rgba(0,0,0,.6);
  font-size:13px;display:none;white-space:nowrap}
#badge.unl{border:1px solid var(--ac);cursor:pointer}
#badge.unl b{color:var(--ac);font-weight:600}
/* 0.8.3: 解除僅觀看 with the password (fixed link) */
#unlIn{width:100%;box-sizing:border-box;margin:10px 0 4px;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:var(--fg);font:500 17px/1.3 system-ui,sans-serif}
#unlErr{min-height:1.2em;color:var(--ac)}
#lockNote{margin-top:6px;text-align:right}
/* 0.8.3 files both ways */
#fileS .fl{list-style:none;margin:6px 0 0;padding:0;max-height:34vh;overflow:auto}
#fileS .fl li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
#fileS .fl .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fileS .fl .st{flex:0 0 auto;opacity:.75;font-variant-numeric:tabular-nums}
#fileS .fl a{color:var(--ac);text-decoration:none}
#fileS .fl a.used{opacity:.45;pointer-events:none}
#fileS progress{width:64px;height:6px}
#upIn{display:none}
.ib.off{opacity:.4;border-style:dashed}  /* 0.8.3.5 files: this page may not send files (looks off; a tap says why) */
/* "sound on" call to action, shown until used */
#cta{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sb));z-index:4;display:none;align-items:center;gap:8px;
  padding:10px 18px;border-radius:24px;border:0;background:var(--ac);color:#2a1a1c;font-weight:600;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#cta svg{width:20px;height:20px;fill:none;stroke:#2a1a1c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* toast */
#toast{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;top:calc(40px + var(--st));z-index:5;max-width:min(92vw,460px);padding:10px 14px;border-radius:12px;
  background:var(--bg);font-size:14px;display:none;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#toast.warn{border:1px solid var(--ac);font-size:15px}
/* 0.8.3.5: the PC browser's bar (a mouse is used): top middle, out of the way until the mouse comes up */
#pcbar{position:absolute;left:50%;top:0;transform:translate(-50%,-100%);z-index:6;display:none;transition:transform .18s ease-out;padding-bottom:10px}
body.pcui #pcbar{display:block}
body.pcui #pcbar.show{transform:translate(-50%,0)}
#pcbarIn{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;padding:6px 8px;margin-top:6px;background:rgba(30,20,22,.92);border:1px solid rgba(245,167,167,.35);
  border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.45);white-space:nowrap}
#pcbarTab{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:56px;height:5px;border-radius:3px;background:var(--ac);opacity:.75}
body.pcui #pcbar.show #pcbarTab{opacity:0}
#pcbar .grp{display:flex;gap:4px;align-items:center}
#pcbar .grp+.grp{border-left:1px solid rgba(255,255,255,.14);padding-left:6px;margin-left:2px}
#pcbar button{border:1px solid transparent;background:none;color:var(--fg);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px}
#pcbar button:hover{background:rgba(245,167,167,.16);border-color:rgba(245,167,167,.35)}
#pcbar button.on{background:var(--ac);color:#2a1a1c;font-weight:600}
#pcbar button.off{opacity:.45;border:1px dashed rgba(255,255,255,.35)}  /* rel-0835 files: the PC bar's 檔案 looks off like the phone's (hover / a click says why) */
#pcbar button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pcbar .pk{font:600 12px/1.2 ui-monospace,Consolas,monospace;border-color:rgba(255,255,255,.16)}
body.pcui #pad{cursor:default}
body.game #pcbar{display:none!important}
/* (d) a PC's browser: everything is on the top bar; the phone's round buttons go */
body.pcui #bar{display:none}
#pbMons{display:flex;gap:2px}
#pbMons button{font-variant-numeric:tabular-nums;padding:5px 8px}
@media (max-width:1100px){#pcbar .pl{display:none}#pcbar button{padding:5px 7px}}
@media (max-width:760px){#pgKeys .pk:nth-child(n+4){display:none}}
/* rel-0835: the bar never wider than the window (en / ja labels and two or more screens were cut at both ends at
   1280 px): fitPcbar() drops the labels (c1), then the rarer keys (c2), whatever the window width */
#pcbar.c1 .pl{display:none}#pcbar.c1 button{padding:5px 7px}#pcbar.c2 #pgKeys .pk:nth-child(n+4){display:none}
#pcbar.c3 #pbLockT{display:none}#pcbar.c3 button,#pcbar.c3 #pbMons button{padding:5px 5px}#pcbar.c3 .grp{gap:2px}#pcbar.c3 .grp+.grp{padding-left:4px;margin-left:0}#pcbar.c3 #pcbarIn{gap:3px;padding:5px 6px}
#lockHint{position:absolute;left:50%;top:calc(10px + var(--st));transform:translateX(-50%);z-index:6;display:none;pointer-events:none;padding:4px 12px;border-radius:12px;
  background:rgba(30,20,22,.8);border:1px solid rgba(245,167,167,.45);font-size:12px;color:var(--fg);white-space:nowrap;transition:all .25s}
#lockHint.big{top:40%;padding:14px 22px;font-size:16px;border-radius:14px;background:rgba(30,20,22,.92);white-space:normal;max-width:min(90vw,460px);text-align:center}
body.pcui #toast{top:calc(64px + var(--st))}
/* 0.8.3.5 (b): where a PC keyboard's input method composes (Chinese / Japanese / Korean); invisible,
   placed at the mouse so the candidate window shows there */
#ime{position:absolute;left:0;top:0;width:2px;height:20px;opacity:0;border:0;padding:0;margin:0;resize:none;overflow:hidden;font-size:16px;z-index:1;
  pointer-events:none;color:transparent;background:transparent;caret-color:transparent}
/* 0.8.3.5 ②: the PC pointer in 觸控板 mode, big and high-contrast (the real one is ~3 px on a phone at 3440 wide) */
#tcur{position:absolute;z-index:3;left:0;top:0;width:48px;height:48px;margin:-13px 0 0 -13px;pointer-events:none;display:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
#tcur svg{width:48px;height:48px;display:block}
/* 0.8.3.5 ②: which mode the phone is in, said once (and again after taps far from the pointer) */
#modeHint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sb));z-index:7;width:min(92vw,420px);background:var(--bg);
  border:1px solid var(--ac);border-radius:14px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:none}
#mhT{font-size:16px;font-weight:600;color:var(--ac);margin-bottom:6px}
#mhS{font-size:14px;line-height:1.5;opacity:.9}
#modeHint .btnrow{padding-top:10px}
#modeHint .btn{background:var(--ac);color:#2a1a1c;border:0;font-weight:600}
#modeHint .btn.alt{background:rgba(255,255,255,.08);color:var(--fg);border:1px solid rgba(255,255,255,.25)}
body.sheet-open #modeHint,body.hint-open #cta{display:none!important}
/* #8: a card for a PC's browser (the keyboard lock refused), under the bar */
#pcCard{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + var(--st));z-index:7;width:min(92vw,460px);background:var(--bg);
  border:1px solid var(--ac);border-radius:14px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:none}
#pcT{font-size:16px;font-weight:600;color:var(--ac);margin-bottom:6px}
#pcS{font-size:14px;line-height:1.5;opacity:.9}
#pcCard .btnrow{padding-top:10px}
#pcCard .btn{background:var(--ac);color:#2a1a1c;border:0;font-weight:600}
#pcCard .btn.alt{background:rgba(255,255,255,.08);color:var(--fg);border:1px solid rgba(255,255,255,.25)}
#bar{gap:10px}
/* sheets (settings, help, keyboard) */
.sheet{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);max-height:calc(100% - 12px - var(--st));overflow:auto;
  background:var(--bg);border-radius:16px 16px 0 0;padding:14px 16px calc(14px + var(--sb));display:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  box-shadow:0 -6px 30px rgba(0,0,0,.45)}
body.sheet-open #cta{display:none!important}
.sheet h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h3 button{border:0;background:none;color:var(--ac);font-size:15px;padding:6px 4px;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.row>label,.row>.lbl{flex:1 1 140px;min-width:0}
.sub{display:block;font-size:12px;opacity:.65;margin-top:2px}
.seg{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:10px;overflow:hidden;flex:0 1 auto;max-width:100%}
.seg button{border:0;background:none;padding:7px 11px;font-size:14px;white-space:nowrap;min-width:0}
.seg button.on{background:var(--ac);color:#2a1a1c;font-weight:600}
input[type=range]{flex:1 1 160px;accent-color:var(--ac);min-width:120px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,.25);position:relative;flex:0 0 46px;margin:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.sw:checked{background:var(--ac)}.sw:checked::after{left:21px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px}
.btn{flex:1 1 auto;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;font-size:15px;white-space:nowrap}
.btn.warn{border-color:#e57373;color:#ffb3b3}
#help ul{margin:6px 0 10px;padding-left:20px}#help li{margin:4px 0}
#help a{color:var(--ac)}
/* keyboard panel */
#kb input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0}
#kbhint{font-size:13px;opacity:.75;margin-bottom:8px}
#keys{display:flex;flex-wrap:wrap;gap:6px}
#keys button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);border-radius:9px;padding:8px 10px;font-size:14px;white-space:nowrap;min-width:44px}
#keys button.on{background:var(--ac);color:#2a1a1c;border-color:var(--ac)}
#keys .sep{flex-basis:100%;height:0}
#keys button.warnk{border-color:#e57373;color:#ffb3b3}
#keys #bClip{border-color:var(--ac);color:var(--ac)}
textarea{width:100%;margin-top:6px;font:16px/1.4 inherit;font-family:inherit;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);
  border-radius:10px;padding:8px;resize:vertical;-webkit-user-select:text;user-select:text;touch-action:auto}
/* predicted PC pointer (O7): shown while the PC has not caught up with the finger yet */
#cur{position:absolute;z-index:3;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid #fff;background:rgba(245,167,167,.55);
  box-shadow:0 0 0 1px rgba(0,0,0,.6);pointer-events:none;display:none}

/* tap feedback: a ring where the click happened */
.rip{position:absolute;z-index:3;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--ac);pointer-events:none;
  animation:rip .38s ease-out forwards}
.rip.r2{border-style:double;border-width:6px}
@keyframes rip{from{transform:scale(.3);opacity:.95}to{transform:scale(1.35);opacity:0}}
#ask{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:24px}
#askBox{background:var(--bg);border-radius:14px;padding:18px;max-width:360px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#askT{font-size:16px;margin-bottom:14px}
/* full-page message (connecting / waiting for the PC / errors) */
#msg{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;
  background:var(--bg);padding:24px calc(24px + var(--sr)) calc(24px + var(--sb)) calc(24px + var(--sl))}
#msg.hide{display:none}
#msg.over{background:rgba(0,0,0,.72)}
#msgT{font-size:19px;font-weight:600;max-width:520px}
#msgS{font-size:14px;opacity:.75;max-width:520px;white-space:pre-line}
.nw{white-space:nowrap}
#msgB{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#msgB .btn{flex:0 1 auto;background:var(--ac);color:#2a1a1c;border:0;font-weight:600;min-width:120px}
#msgB .btn.alt{background:rgba(255,255,255,.1);color:var(--fg)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--ac);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#app{font-size:13px;opacity:.55}
/* the browser only starts the picture after a tap (iPhone Low Power Mode / some in-app browsers):
   asked for at once, while the connection is still being set up */
#tapHint{position:absolute;left:0;right:0;bottom:calc(18px + var(--sb));z-index:10;display:none;justify-content:center;pointer-events:none}
#tapHint span{padding:12px 20px;border-radius:24px;background:var(--ac);color:#2a1a1c;font-weight:600;font-size:16px;box-shadow:0 4px 16px rgba(0,0,0,.4);
  max-width:calc(100% - 32px);text-align:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
#rowSens input{flex:1 1 100%}
#rowVol input{flex:1 1 100%}
#rowMutePc.off label{opacity:.55}
#volV{font-variant-numeric:tabular-nums;opacity:.8;min-width:3.5em;text-align:right}
/* phone sideways: tighter rows so the settings fit without scrolling */
@media (max-height:500px){.sheet{padding-top:8px}.sheet h3{margin-bottom:2px}.row{padding:4px 0}.sub{display:none}.btnrow{padding-top:6px}.btn{padding:7px 12px}
  #keys button{padding:6px 9px}#kbhint{display:none}#rowSens input{flex:1 1 200px}}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay disablepictureinpicture></video>
<canvas id="scr"></canvas>
<div id="pad"></div>
<textarea id="ime" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" tabindex="-1" aria-hidden="true"></textarea>
<div id="hud"></div>
<div id="badge"></div>
<button id="cta"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span id="ctaT"></span></button>
<div id="bar">

// ---- O1: weak-network adaptation. Every 2 s from the browser's own receive
// statistics: bad = packet loss > 4 %, RTT > 300 ms, or far fewer frames
// shown than the PC sends (> 35 % short). Two bad windows in a row: first the
// bitrate goes down (70 %, then 45 % of the preset), then one quality step
// (new session, same phone). Up again only after a long good stretch (bitrate
// after 10 s, quality after 30 s), never above the user's choice.
const adapt = {
  last: null, bad: 0, good: 0, level: 0, kbps: 0, log: [],
  reset() { this.last = null; this.bad = this.good = 0; this.level = 0; this.kbps = 0; },
  preset(q) { return [6000, 10000, 14000][q] || 14000; },
  restore() {
    if (this.level) { this.level = 0; send({t: 'bitrate', kbps: this.preset(curQ)}); }
    if (curQ !== prefs.q) { curQ = prefs.q; connect('switch'); }
  },
  async tick() {
    if (!pc || S.state !== 'connected' || document.hidden) { this.last = null; return; }
    let inb = null;
    try { (await pc.getStats()).forEach(s => { if (s.type === 'inbound-rtp' && s.kind === 'video') inb = s; }); } catch { return; }
    if (!inb) return;
    const now = {recv: inb.packetsReceived || 0, lost: inb.packetsLost || 0, frames: inb.framesDecoded || 0, t: performance.now()};
    const prev = this.last; this.last = now;
    if (!prev) return;
    const dRecv = now.recv - prev.recv, dLost = Math.max(0, now.lost - prev.lost);
    const loss = (dRecv + dLost) > 50 ? dLost / (dRecv + dLost) : 0;
    const shown = (now.frames - prev.frames) * 1000 / (now.t - prev.t);
    const sent = S.srv ? S.srv.fps : 0;
    const short = sent > 5 && shown < sent * 0.65;
    const simLoss = +(Q.get('simloss') || 0) / 100;  // tests: pretend this much loss
    const bad = loss > 0.04 || simLoss > 0.04 || (isFinite(S.rtt) && S.rtt > 300) || short;
    S.adapt = {loss: +(Math.max(loss, simLoss) * 100).toFixed(1), shown: +shown.toFixed(1), sent: +(sent || 0).toFixed(1), rtt: S.rtt, level: this.level, q: curQ};
    if (!prefs.auto) return;
    if (bad) { this.bad++; this.good = 0; } else { this.good++; this.bad = 0; }
    if (this.bad >= 2) {
      this.bad = 0;
      if (this.level < 2) {
        this.level++;
        this.kbps = Math.round(this.preset(curQ) * (this.level === 1 ? 0.7 : 0.45));
        send({t: 'bitrate', kbps: this.kbps});
        diag('adapt-down', {to: 'bitrate', kbps: this.kbps, why: S.adapt});
      } else if (curQ > 0) {
        curQ--; this.level = 0;
        diag('adapt-down', {to: 'quality', q: curQ, why: S.adapt});
        toast(tf('autoDown', t('q' + curQ)), 4000);
        connect('switch');
      }
    } else if (this.good >= 5 && this.level > 0) {  // 10 s good: bitrate back up a step
      this.good = 0; this.level--;
      this.kbps = this.level ? Math.round(this.preset(curQ) * 0.7) : this.preset(curQ);
      send({t: 'bitrate', kbps: this.kbps});
      diag('adapt-up', {to: 'bitrate', kbps: this.kbps});
    } else if (this.good >= 15 && curQ < prefs.q) {  // 30 s good at full bitrate: one quality step up
      this.good = 0; curQ++;
      diag('adapt-up', {to: 'quality', q: curQ});
      toast(tf('autoUp', t('q' + curQ)), 3000);
      connect('switch');
    }
  },
};
