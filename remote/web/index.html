<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="自在遠端">
<title>Remote</title>
<style>
:root{--bg:#1E1416;--fg:#F6E9EA;--ac:#F5A7A7;--panel:rgba(30,20,22,.94);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font:15px/1.4 -apple-system,system-ui,"Microsoft JhengHei","Hiragino Sans","Apple SD Gothic Neo",sans-serif;
  overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transform-origin:50% 50%}
/* 外網連結 when WebRTC cannot connect: H.264 over the tunnel, decoded with WebCodecs onto this canvas */
#scr{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transform-origin:50% 50%;display:none}
/* which path the picture takes (直連 / 隧道) and the round trip, top right */
#path{position:absolute;right:calc(6px + var(--sr));top:calc(6px + var(--st));z-index:4;padding:3px 9px;border-radius:12px;background:rgba(0,0,0,.6);
  font-size:12px;display:none;white-space:nowrap;pointer-events:none}
#path.tun{color:#ffd9a0}
/* 通行碼 (外網連結) */
#pass{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);
  padding:24px calc(24px + var(--sr)) calc(24px + var(--sb)) calc(24px + var(--sl));text-align:center}
#passT{font-size:19px;font-weight:600}
#passS{font-size:14px;opacity:.75;max-width:420px}
#passIn{font:600 30px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:10px;width:min(270px,82vw);text-align:center;padding:10px 6px 10px 16px;border-radius:12px;
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:var(--fg);-webkit-user-select:text;user-select:text;touch-action:auto}
#passGo{flex:0 0 auto;min-width:140px;background:var(--ac);color:#2a1a1c;border:0;font-weight:600}
#passErr{font-size:14px;color:#ffb3b3;min-height:20px}
#pass.pw #passIn{letter-spacing:normal;font:500 20px/1.3 system-ui,sans-serif;padding:12px 14px;width:min(320px,86vw)}
#pad{position:absolute;inset:0;z-index:2}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#hud{position:absolute;left:calc(6px + var(--sl));top:calc(6px + var(--st));z-index:3;padding:4px 8px;background:rgba(0,0,0,.62);border-radius:8px;
  font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;pointer-events:none;display:none;max-width:calc(100% - 12px);overflow:hidden}
/* toolbar: small round icon buttons, bottom right (thumb reach), never over the middle */
#bar{position:absolute;right:calc(8px + var(--sr));bottom:calc(8px + var(--sb));z-index:4;display:flex;gap:8px;align-items:center}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:rgba(20,20,20,.62);display:flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--ac);border-color:var(--ac)}.ib.on svg{stroke:#2a1a1c}
#bar .ib{transition:opacity .4s}
#bar.dim .ib{opacity:.35}

#silent{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100% - 24px);bottom:calc(64px + var(--sb));z-index:4;padding:6px 14px;border-radius:14px;
  background:rgba(0,0,0,.66);font-size:13px;display:none;text-align:center;pointer-events:none}
body.sheet-open #silent{display:none!important}
#badge{position:absolute;left:50%;transform:translateX(-50%);top:calc(6px + var(--st));z-index:4;padding:3px 10px;border-radius:12px;background:rgba(0,0,0,.6);
  font-size:13px;display:none;white-space:nowrap}
#badge.unl{border:1px solid var(--ac);cursor:pointer}
#badge.unl b{color:var(--ac);font-weight:600}
/* 0.8.3: 解除僅觀看 with the password (fixed link) */
#unlIn{width:100%;box-sizing:border-box;margin:10px 0 4px;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:var(--fg);font:500 17px/1.3 system-ui,sans-serif}
#unlErr{min-height:1.2em;color:var(--ac)}
#lockNote{margin-top:6px;text-align:right}
/* 0.8.3 files both ways */
#fileS .fl{list-style:none;margin:6px 0 0;padding:0;max-height:34vh;overflow:auto}
#fileS .fl li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
#fileS .fl .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fileS .fl .st{flex:0 0 auto;opacity:.75;font-variant-numeric:tabular-nums}
#fileS .fl a{color:var(--ac);text-decoration:none}
#fileS .fl a.used{opacity:.45;pointer-events:none}
#fileS progress{width:64px;height:6px}
#upIn{display:none}
/* "sound on" call to action, shown until used */
#cta{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + var(--sb));z-index:4;display:none;align-items:center;gap:8px;
  padding:10px 18px;border-radius:24px;border:0;background:var(--ac);color:#2a1a1c;font-weight:600;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#cta svg{width:20px;height:20px;fill:none;stroke:#2a1a1c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* toast */
#toast{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;top:calc(40px + var(--st));z-index:5;max-width:min(92vw,460px);padding:10px 14px;border-radius:12px;
  background:var(--bg);font-size:14px;display:none;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.4)}
/* sheets (settings, help, keyboard) */
.sheet{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);max-height:calc(100% - 12px - var(--st));overflow:auto;
  background:var(--bg);border-radius:16px 16px 0 0;padding:14px 16px calc(14px + var(--sb));display:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  box-shadow:0 -6px 30px rgba(0,0,0,.45)}
body.sheet-open #cta{display:none!important}
.sheet h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h3 button{border:0;background:none;color:var(--ac);font-size:15px;padding:6px 4px;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.row>label,.row>.lbl{flex:1 1 140px;min-width:0}
.sub{display:block;font-size:12px;opacity:.65;margin-top:2px}
.seg{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:10px;overflow:hidden;flex:0 1 auto;max-width:100%}
.seg button{border:0;background:none;padding:7px 11px;font-size:14px;white-space:nowrap;min-width:0}
.seg button.on{background:var(--ac);color:#2a1a1c;font-weight:600}
input[type=range]{flex:1 1 160px;accent-color:var(--ac);min-width:120px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,.25);position:relative;flex:0 0 46px;margin:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.sw:checked{background:var(--ac)}.sw:checked::after{left:21px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px}
.btn{flex:1 1 auto;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;font-size:15px;white-space:nowrap}
.btn.warn{border-color:#e57373;color:#ffb3b3}
#help ul{margin:6px 0 10px;padding-left:20px}#help li{margin:4px 0}
#help a{color:var(--ac)}
/* keyboard panel */
#kb input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0}
#kbhint{font-size:13px;opacity:.75;margin-bottom:8px}
#keys{display:flex;flex-wrap:wrap;gap:6px}
#keys button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);border-radius:9px;padding:8px 10px;font-size:14px;white-space:nowrap;min-width:44px}
#keys button.on{background:var(--ac);color:#2a1a1c;border-color:var(--ac)}
#keys .sep{flex-basis:100%;height:0}
#keys button.warnk{border-color:#e57373;color:#ffb3b3}
#keys #bClip{border-color:var(--ac);color:var(--ac)}
textarea{width:100%;margin-top:6px;font:16px/1.4 inherit;font-family:inherit;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);
  border-radius:10px;padding:8px;resize:vertical;-webkit-user-select:text;user-select:text;touch-action:auto}
/* predicted PC pointer (O7): shown while the PC has not caught up with the finger yet */
#cur{position:absolute;z-index:3;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid #fff;background:rgba(245,167,167,.55);
  box-shadow:0 0 0 1px rgba(0,0,0,.6);pointer-events:none;display:none}

/* tap feedback: a ring where the click happened */
.rip{position:absolute;z-index:3;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--ac);pointer-events:none;
  animation:rip .38s ease-out forwards}
.rip.r2{border-style:double;border-width:6px}
@keyframes rip{from{transform:scale(.3);opacity:.95}to{transform:scale(1.35);opacity:0}}
#ask{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:24px}
#askBox{background:var(--bg);border-radius:14px;padding:18px;max-width:360px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#askT{font-size:16px;margin-bottom:14px}
/* full-page message (connecting / waiting for the PC / errors) */
#msg{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;
  background:var(--bg);padding:24px calc(24px + var(--sr)) calc(24px + var(--sb)) calc(24px + var(--sl))}
#msg.hide{display:none}
#msg.over{background:rgba(0,0,0,.72)}
#msgT{font-size:19px;font-weight:600;max-width:520px}
#msgS{font-size:14px;opacity:.75;max-width:520px;white-space:pre-line}
.nw{white-space:nowrap}
#msgB{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#msgB .btn{flex:0 1 auto;background:var(--ac);color:#2a1a1c;border:0;font-weight:600;min-width:120px}
#msgB .btn.alt{background:rgba(255,255,255,.1);color:var(--fg)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--ac);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#app{font-size:13px;opacity:.55}
/* the browser only starts the picture after a tap (iPhone Low Power Mode / some in-app browsers):
   asked for at once, while the connection is still being set up */
#tapHint{position:absolute;left:0;right:0;bottom:calc(18px + var(--sb));z-index:10;display:none;justify-content:center;pointer-events:none}
#tapHint span{padding:12px 20px;border-radius:24px;background:var(--ac);color:#2a1a1c;font-weight:600;font-size:16px;box-shadow:0 4px 16px rgba(0,0,0,.4);
  max-width:calc(100% - 32px);text-align:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
#rowSens input{flex:1 1 100%}
#rowVol input{flex:1 1 100%}
#volV{font-variant-numeric:tabular-nums;opacity:.8;min-width:3.5em;text-align:right}
/* phone sideways: tighter rows so the settings fit without scrolling */
@media (max-height:500px){.sheet{padding-top:8px}.sheet h3{margin-bottom:2px}.row{padding:4px 0}.sub{display:none}.btnrow{padding-top:6px}.btn{padding:7px 12px}
  #keys button{padding:6px 9px}#kbhint{display:none}#rowSens input{flex:1 1 200px}}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay disablepictureinpicture></video>
<canvas id="scr"></canvas>
<div id="pad"></div>
<div id="hud"></div>
<div id="badge"></div>
<button id="cta"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span id="ctaT"></span></button>
<div id="bar">
  <button class="ib" id="bSnd"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="sndWave" d="M15.5 8.5a5 5 0 0 1 0 7"/><path id="sndX" d="m16 9 6 6m0-6-6 6"/></svg></button>
  <button class="ib" id="bZoom"><svg viewBox="0 0 24 24"><g id="zIn"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M11 8v6M8 11h6"/></g><g id="zFit"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></g></svg></button>
  <button class="ib" id="bFile"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13l3-3 3 3"/></svg></button>
  <button class="ib" id="bKb"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
  <button class="ib" id="bSet"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>
<div id="toast"></div>
<div id="silent"></div>
<div id="path"></div>
<div id="cur"></div>

<div class="sheet" id="set">
  <h3><span id="setT"></span><button id="setClose"></button></h3>
  <div class="row"><span class="lbl" id="lMode"></span><div class="seg" id="segMode"><button data-v="trackpad"></button><button data-v="direct"></button></div></div>
  <div class="row" id="rowVol"><label for="vol"><span id="lVol"></span><span class="sub" id="lVolSub"></span></label><span id="volV"></span><input type="range" id="vol" min="0" max="300" step="10"></div>
  <div class="row" id="rowSens"><label for="sens"><span id="lSens"></span><span class="sub" id="lSensSub"></span></label><input type="range" id="sens" min="0.3" max="2.5" step="0.1"></div>
  <div class="row"><span class="lbl"><span id="lQ"></span><span class="sub" id="lQSub"></span></span><div class="seg" id="segQ"><button data-v="0"></button><button data-v="1"></button><button data-v="2"></button></div></div>
  <div class="row"><label for="swAuto"><span id="lAuto"></span><span class="sub" id="lAutoSub"></span></label><input type="checkbox" class="sw" id="swAuto"></div>
  <div class="row" id="rowMon" style="display:none"><span class="lbl" id="lMon"></span><div class="seg" id="segMon"></div></div>
  <div class="row"><label for="swFill" id="lFill"></label><input type="checkbox" class="sw" id="swFill"></div>
  <div class="row"><label for="swLock"><span id="lLock"></span><span class="sub" id="lLockSub"></span></label><input type="checkbox" class="sw" id="swLock"></div>
  <div class="row" id="rowFs" style="display:none"><label for="swFs" id="lFs"></label><input type="checkbox" class="sw" id="swFs"></div>
  <div class="row"><label for="swHud"><span id="lHud"></span><span class="sub" id="lHudSub"></span></label><input type="checkbox" class="sw" id="swHud"></div>
  <div class="btnrow"><button class="btn" id="bHelp"></button><button class="btn warn" id="bBye"></button></div>
  <div class="sub" id="lockNote" style="display:none"></div>
  <div id="app"></div>
</div>

<div class="sheet" id="fileS">
  <h3><span id="fileT"></span><button id="fileClose"></button></h3>
  <b id="upT"></b><span class="sub" id="upHint"></span>
  <input type="file" id="upIn" multiple>
  <div class="btnrow"><button class="btn" id="upPick"></button></div>
  <ul class="fl" id="upList"></ul>
  <div style="height:14px"></div>
  <b id="dlT"></b><span class="sub" id="dlHint"></span>
  <div class="btnrow"><button class="btn" id="dlRefresh"></button></div>
  <ul class="fl" id="dlList"></ul>
</div>

<div class="sheet" id="unl">
  <h3><span id="unlT"></span><button id="unlClose"></button></h3>
  <span class="sub" id="unlS"></span>
  <input id="unlIn" type="password" autocomplete="current-password" maxlength="256" aria-label="password">
  <div id="unlErr" class="sub"></div>
  <div class="btnrow"><button class="btn warn" id="unlGo"></button></div>
</div>

<div class="sheet" id="help">
  <h3><span id="helpT"></span><button id="helpClose"></button></h3>
  <div id="helpBody"></div>
</div>

<div class="sheet" id="clipS">
  <h3><span id="clipT"></span><button id="clipClose"></button></h3>
  <b id="clipToPc"></b><span class="sub" id="clipToPcHint"></span>
  <textarea id="clipIn" rows="3"></textarea>
  <div class="btnrow"><button class="btn" id="clipSend"></button><button class="btn" id="clipType"></button></div>
  <div style="height:14px"></div>
  <b id="clipFromPc"></b><span class="sub" id="clipFromPcHint"></span>
  <textarea id="clipOut" rows="3" readonly></textarea>
  <div class="btnrow"><button class="btn" id="clipCopy"></button></div>
</div>

<div class="sheet" id="kb">
  <input id="txt" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <h3><span id="kbT"></span><button id="kbClose"></button></h3>
  <div id="kbhint"></div>
  <div id="keys">
    <button data-m="Control">Ctrl</button><button data-m="Alt">Alt</button><button data-m="Shift">Shift</button><button data-m="Meta">Win</button>
    <button data-k="Escape">Esc</button><button data-k="Tab">Tab</button><button data-k="Enter">Enter</button><button data-k="Backspace">⌫</button>
    <span class="sep"></span>
    <button data-k="ArrowLeft">←</button><button data-k="ArrowUp">↑</button><button data-k="ArrowDown">↓</button><button data-k="ArrowRight">→</button>
    <button data-k="Home">Home</button><button data-k="End">End</button><button data-k="Delete">Del</button>
    <span class="sep"></span>
    <button data-c="Control+C" data-t="copy"></button><button data-c="Control+V" data-t="paste"></button><button data-c="Control+Z" data-t="undo"></button>
    <button data-c="Alt+Tab">Alt+Tab</button><button data-c="Meta+D" data-t="desktop"></button><button data-c="Meta" data-t="start"></button>
    <span class="sep"></span>
    <button data-c="Control+A" data-t="selAll"></button><button data-c="Control+S" data-t="save"></button><button data-c="Control+F" data-t="find"></button>
    <button data-c="Meta+Tab" data-t="taskView"></button><button data-c="Meta+E" data-t="explorer"></button><button data-c="Meta+Shift+S" data-t="snip"></button>
    <button data-c="Control+Shift+Escape" data-t="taskMgr" data-note="taskMgrNote"></button><button data-c="Alt+F4" data-t="closeWin" data-confirm="closeWinAsk" class="warnk"></button>
    <button id="bClip"></button>
  </div>
</div>

<div id="ask"><div id="askBox"><div id="askT"></div><div class="btnrow"><button class="btn" id="askNo"></button><button class="btn warn" id="askYes"></button></div></div></div>
<div id="msg"><div class="spin" id="msgSpin"></div><div id="msgT"></div><div id="msgS"></div><div id="msgB"></div></div>
<div id="tapHint"><span id="tapHintT"></span></div>
<div id="pass"><div id="passT"></div><div id="passS"></div>
  <input id="passIn" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" aria-label="passcode">

$('lSens').textContent = t('sens');

$('lQSub').textContent = t('qSub');

$('lFs').textContent = t('fullscreen');
$('lLock').textContent = t('lock');
$('lLockSub').textContent = t('lockSub');

$('lAuto').textContent = t('auto');
$('lAutoSub').textContent = t('autoSub');
$('lHudSub').textContent = t('hudSub');
$('lVol').textContent = t('vol');
$('lVolSub').textContent = t('volSub');
const showVol = () => { $('vol').value = prefs.gain; $('volV').textContent = prefs.gain + '%'; };
showVol();
$('vol').oninput = () => {
  prefs.gain = Math.max(0, Math.min(300, +$('vol').value | 0)); store.set('gain083', prefs.gain); showVol();
  if (snd.gain) snd.gain.gain.setTargetAtTime(prefs.gain / 100, snd.ctx.currentTime, 0.03);
};
$('bHelp').textContent = t('gestures');
$('bBye').textContent = t('disconnect');
$('app').textContent = PM.app;
const segMode = $('segMode'), segQ = $('segQ');
segMode.children[0].textContent = t('trackpad'); segMode.children[1].textContent = t('direct');
for (let i = 0; i < 3; i++) segQ.children[i].textContent = t('q' + i);
function syncSettings() {
  for (const b of segMode.children) b.classList.toggle('on', b.dataset.v === prefs.mode);
  for (const b of segQ.children) b.classList.toggle('on', +b.dataset.v === prefs.q);
  for (const b of $('segMon').children) b.classList.toggle('on', +b.dataset.v === prefs.mon);
  $('rowSens').style.display = prefs.mode === 'trackpad' ? '' : 'none';
  $('sens').value = prefs.sens;
  $('swFill').checked = prefs.fill;
  $('swLock').checked = prefs.lock;
  trackpad.zoomLocked = prefs.lock;
  syncZoomBtn();
  $('swHud').checked = prefs.hud;
  $('swAuto').checked = prefs.auto;
  hud.style.display = prefs.hud ? 'block' : 'none';
}
function setMode(m) { prefs.mode = m; store.set('mode083', m); trackpad.mode = m; syncSettings(); return true; }
function setQuality(q) {
  q = Math.max(0, Math.min(2, q | 0));
  if (q === prefs.q && q === curQ) return true;
  prefs.q = q; store.set('q', q); syncSettings();
  curQ = q; adapt.reset();
  connect('switch');  // a new stream size: new session (same phone, no new 允許)
  return true;
}
$('swAuto').onchange = () => { prefs.auto = $('swAuto').checked; store.set('auto', prefs.auto); if (!prefs.auto) adapt.restore(); };

// ---- O1: weak-network adaptation. Every 2 s from the browser's own receive
// statistics: bad = packet loss > 4 %, RTT > 300 ms, or far fewer frames
// shown than the PC sends (> 35 % short). Two bad windows in a row: first the
// bitrate goes down (70 %, then 45 % of the preset), then one quality step
// (new session, same phone). Up again only after a long good stretch (bitrate
// after 10 s, quality after 30 s), never above the user's choice.
const adapt = {
  last: null, bad: 0, good: 0, level: 0, kbps: 0, log: [],
  reset() { this.last = null; this.bad = this.good = 0; this.level = 0; this.kbps = 0; },
  preset(q) { return [6000, 10000, 14000][q] || 14000; },
  restore() {
    if (this.level) { this.level = 0; send({t: 'bitrate', kbps: this.preset(curQ)}); }
    if (curQ !== prefs.q) { curQ = prefs.q; connect('switch'); }
  },
  async tick() {
    if (!pc || S.state !== 'connected' || document.hidden) { this.last = null; return; }
    let inb = null;
    try { (await pc.getStats()).forEach(s => { if (s.type === 'inbound-rtp' && s.kind === 'video') inb = s; }); } catch { return; }
    if (!inb) return;
    const now = {recv: inb.packetsReceived || 0, lost: inb.packetsLost || 0, frames: inb.framesDecoded || 0, t: performance.now()};
    const prev = this.last; this.last = now;
    if (!prev) return;
    const dRecv = now.recv - prev.recv, dLost = Math.max(0, now.lost - prev.lost);
    const loss = (dRecv + dLost) > 50 ? dLost / (dRecv + dLost) : 0;
    const shown = (now.frames - prev.frames) * 1000 / (now.t - prev.t);
    const sent = S.srv ? S.srv.fps : 0;
    const short = sent > 5 && shown < sent * 0.65;
    const simLoss = +(Q.get('simloss') || 0) / 100;  // tests: pretend this much loss
    const bad = loss > 0.04 || simLoss > 0.04 || (isFinite(S.rtt) && S.rtt > 300) || short;
    S.adapt = {loss: +(Math.max(loss, simLoss) * 100).toFixed(1), shown: +shown.toFixed(1), sent: +(sent || 0).toFixed(1), rtt: S.rtt, level: this.level, q: curQ};
    if (!prefs.auto) return;
    if (bad) { this.bad++; this.good = 0; } else { this.good++; this.bad = 0; }
    if (this.bad >= 2) {
      this.bad = 0;
      if (this.level < 2) {
        this.level++;
        this.kbps = Math.round(this.preset(curQ) * (this.level === 1 ? 0.7 : 0.45));
        send({t: 'bitrate', kbps: this.kbps});
        diag('adapt-down', {to: 'bitrate', kbps: this.kbps, why: S.adapt});
      } else if (curQ > 0) {
        curQ--; this.level = 0;
        diag('adapt-down', {to: 'quality', q: curQ, why: S.adapt});
        toast(tf('autoDown', t('q' + curQ)), 4000);
        connect('switch');
      }
    } else if (this.good >= 5 && this.level > 0) {  // 10 s good: bitrate back up a step
      this.good = 0; this.level--;
      this.kbps = this.level ? Math.round(this.preset(curQ) * 0.7) : this.preset(curQ);
      send({t: 'bitrate', kbps: this.kbps});
      diag('adapt-up', {to: 'bitrate', kbps: this.kbps});
    } else if (this.good >= 15 && curQ < prefs.q) {  // 30 s good at full bitrate: one quality step up
      this.good = 0; curQ++;
      diag('adapt-up', {to: 'quality', q: curQ});
      toast(tf('autoUp', t('q' + curQ)), 3000);
      connect('switch');
    }
  },
};
setInterval(() => adapt.tick(), 2000);

for (const b of segMode.children) b.onclick = () => setMode(b.dataset.v);
for (const b of segQ.children) b.onclick = () => setQuality(+b.dataset.v);
$('sens').oninput = () => { prefs.sens = +$('sens').value; store.set('sens', prefs.sens); };
$('swHud').onchange = () => { prefs.hud = $('swHud').checked; store.set('hud', prefs.hud); send({t: 'stamp', on: prefs.hud}); syncSettings(); };
function buildMonitorSeg() {
  const seg = $('segMon'); seg.textContent = '';
  $('rowMon').style.display = S.monitors.length > 1 ? '' : 'none';
  S.monitors.forEach((m, i) => {
    const b = document.createElement('button'); b.dataset.v = i;
    b.textContent = (i + 1) + (m.primary ? ' (' + t('primary') + ')' : '');
    b.onclick = () => { if (i !== prefs.mon) { prefs.mon = i; store.set('mon', i); syncSettings(); connect('switch'); } };
    seg.appendChild(b);
  });
  syncSettings();
}
// 填滿: zoom the picture until it covers the screen (pan with two fingers).
function fillZoom() { const b = videoBox(); return Math.max(b.r.width / Math.max(1, b.w), b.r.height / Math.max(1, b.h)); }
function applyFill() {
  if (!picW()) return;
  if (prefs.fill) { trackpad.zoom = Math.max(trackpad.zoom, fillZoom()); }
  else if (Math.abs(trackpad.zoom - fillZoom()) < 0.01 || trackpad.zoom < 1.001) { trackpad.zoom = 1; trackpad.panX = trackpad.panY = 0; }
  trackpad._applyZoom();
  syncZoomBtn();
}
$('swFill').onchange
 = () => { prefs.fill = $('swFill').checked; store.set('fill', prefs.fill); if (!prefs.fill) { trackpad.zoom = 1; trackpad.panX = trackpad.panY = 0; } applyFill(); };
window.addEventListener('resize', () => setTimeout(applyFill, 50));
// 適合螢幕 / 原始大小 1:1 (F3): one button; 1:1 = one PC pixel per phone
// pixel, centred on the PC pointer when its position is known.
function syncZoomBtn() {
  const z = trackpad.zoom > 1.01;
  $('zIn').style.display = z ? 'none' : '';
  $('zFit').style.display = z ? '' : 'none';
  $('bZoom').setAttribute('aria-label', z ? t('zoomFit') : t('zoom11'));
  $('bZoom').title = $('bZoom').getAttribute('aria-label');
}
function zoomTo(z, nx, ny) {
  const b = videoBox();
  trackpad.zoom = Math.max(1, Math.min(8, z));
  if (trackpad.zoom <= 1.001) trackpad.panX = trackpad.panY = 0;
  else { trackpad.panX = -(nx - 0.5) * b.w * trackpad.zoom; trackpad.panY = -(ny - 0.5) * b.h * trackpad.zoom; }
  trackpad._applyZoom();
  syncZoomBtn();
}
$('bZoom').onclick = () => {
  if (prefs.lock) { toast(t('locked'), 2000); return; }
  if (trackpad.zoom > 1.01) {
    if (prefs.fill) { prefs.fill = false; store.set('fill', false); $('swFill').checked = false; }
    zoomTo(1);
  } else {
    const c = (typeof cursorNorm === 'function' && cursorNorm()) || {x: 0.5, y: 0.5};
    zoomTo(Math.max(1.5, (picW() || 1920) / (window.devicePixelRatio || 1) / Math.max(1, videoBox().w)), c.x, c.y);
  }
};
$('swLock').onchange = () => { prefs.lock = $('swLock').checked; store.set('lock', prefs.lock); syncSettings(); };
// Full screen: Android / desktop browsers (iPhone Safari has none: 加入主畫面).
const canFs = !!(document.documentElement.requestFullscreen) && !isIOS;
if (canFs) $('rowFs').style.display = '';
$('swFs').onchange = async () => {
  try {
    if ($('swFs').checked) { await document.documentElement.requestFullscreen({navigationUI: 'hide'}); try { await screen.orientation.lock('landscape'); } catch {} }
    else if (document.fullscreenElement) await document.exitFullscreen();
  } catch { $('swFs').checked = !!document.fullscreenElement; }
};
document.addEventListener('fullscreenchange', () => { $('swFs').checked = !!document.fullscreenElement; });
$('bBye').onclick = () => {
  closeSheets();
  send({t: 'release'});
  send({t: 'leave'});  // 0.8.3: the PC ends it at once (and locks itself if it is set to)
  S.bye = 'me'; gen++; clearTimeout(retryTimer);
  setTimeout(stopPc, 50);
  S.state = 'ended';
  showMsg(t('byMe'), '', [[t('reconnect'), () => { retryN = 0; connect(); }]]);
};
// gestures help
$('helpT').textContent = t('gestures');
$('helpClose').textContent = t('close');
$('helpClose').onclick = closeSheets;
$('bHelp').onclick = () => {
  closeSheets();
  const body = $('helpBody'); body.textContent = '';
  for (const [title, list] of [[t('trackpad'), T.gTrackpad[LANG]], [t('direct'), T.gDirect[LANG]]]) {
    const h = document.createElement('b'); h.textContent = title; body.appendChild(h);
    const ul = document.createElement('ul');
    for (const x of list) { const li = document.createElement('li'); li.textContent = x; ul.appendChild(li); }
    body.appendChild(ul);
  }
  const n = document.createElement('div'); n.className = 'sub'; n.textContent = t('gNote'); body.appendChild(n);
  if (PM.help) { const a = document.createElement('a'); a.href = PM.help; a.target = '_blank'; a.rel = 'noopener'; a.textContent = t('tutorial'); a.style.display = 'inline-block'; a.style.marginTop = '10px'; body.appendChild(a); }
  $('help').style.display = 'block';
  syncSheetFlag();

};
syncSettings();
setSound(false, true);

// ---- one-time hints: add to Home Screen (iPhone), turn sideways, Tailscale data use ----
setTimeout(() => {
  if (S.state !== 'connected') return;
  if (PM.tailscale && !store.get('tsHint', false)) { store.set('tsHint', true); toast(t('tsData'), 8000); return; }
  if (isIOS && !standalone && !store.get('a2hsHint', false)) { store.set('a2hsHint', true); toast(t('a2hs'), 9000); return; }
  if (innerHeight > innerWidth && !store.get('rotHint', false)) { store.set('rotHint', true); toast(t('rotate'), 4000); }
}, 4000);

// ---- automated test (?auto): one snapshot of the decoded video to the PC ----
if (AUTO) setTimeout(async function snap() {
  if (!picW()) return setTimeout(snap, 1000);
  const c = document.createElement('canvas'); c.width = picW(); c.height = picH();
  c.getContext('2d').drawImage(tun.media ? scr : v, 0, 0);
  c.toBlob(b => { if (b) post('snap', b).catch(() => {}); }, 'image/png');
}, 6000);

// 0.8.3: the tab / the app is closing: tell the PC (else it waits 15 s for the pings to stop).
addEventListener('pagehide', e => { if (!e.persisted && sessId && !S.bye) { try { send({t: 'leave'}); } catch {} } });
if (FIXED) startFixed(); else if (TUN && !PM.verified) askPass(); else connect();
</script>
