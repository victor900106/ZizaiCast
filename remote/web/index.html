<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="自在遠端">
<title>Remote</title>
<style>
:root{--bg:#1E1416;--fg:#F6E9EA;--ac:#F5A7A7;--panel:rgba(30,20,22,.94);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font:15px/1.4 -apple-system,system-ui,"Microsoft JhengHei","Hiragino Sans","Apple SD Gothic Neo",sans-serif;
  overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transform-origin:50% 50%}
/* 外網連結 when WebRTC cannot connect: H.264 over the tunnel, decoded with WebCodecs onto this canvas */
#scr{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transform-origin:50% 50%;display:none}
/* which path the picture takes (直連 / 隧道) and the round trip, top right */
#path{position:absolute;right:calc(6px + var(--sr));top:calc(6px + var(--st));z-index:4;padding:3px 9px;border-radius:12px;background:rgba(0,0,0,.6);
  font-size:12px;display:none;white-space:nowrap;pointer-events:none}
#path.tun{color:#ffd9a0}
/* 通行碼 (外網連結) */
#pass{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);
  padding:24px calc(24px + var(--sr)) calc(24px + var(--sb)) calc(24px + var(--sl));text-align:center}
#passT{font-size:21px;font-weight:600}
#passS{font-size:16px;opacity:.8;max-width:420px}
/* 0.8.3.3: the fixed link's two kinds of login (owner: the password only; 臨時帳號: the account, often from the address) */
#userRow{font-size:16px;display:none;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
#userRow b{font-size:18px;color:var(--ac)}
.lnk{border:0;background:none;color:var(--ac);font-size:15px;text-decoration:underline;padding:6px 4px}
#pwEye{display:none}#pass.pw #pwEye{display:inline-block}
#passIn{font:600 30px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:10px;width:min(270px,82vw);text-align:center;padding:10px 6px 10px 16px;border-radius:12px;
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:var(--fg);-webkit-user-select:text;user-select:text;touch-action:auto}
#passGo{flex:0 0 auto;min-width:140px;background:var(--ac);color:#2a1a1c;border:0;font-weight:600}
#passErr{font-size:14px;color:#ffb3b3;min-height:20px}
#pass.pw #passIn,#userIn{letter-spacing:normal;font:500 20px/1.3 system-ui,sans-serif;padding:12px 14px;width:min(320px,86vw);text-align:center;border-radius:12px;
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:var(--fg);-webkit-user-select:text;user-select:text;touch-action:auto}
#pad{position:absolute;inset:0;z-index:2}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#hud{position:absolute;left:calc(6px + var(--sl));top:calc(6px + var(--st));z-index:3;padding:4px 8px;background:rgba(0,0,0,.62);border-radius:8px;
  font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;pointer-events:none;display:none;max-width:calc(100% - 12px);overflow:hidden}
/* toolbar: small round icon buttons, bottom right (thumb reach), never over the middle */
#bar{position:absolute;right:calc(8px + var(--sr));bottom:calc(24px + var(--sb));z-index:4;display:flex;gap:14px;align-items:center}
.ib{position:relative;width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:rgba(20,20,20,.62);display:flex;align-items:center;justify-content:center;padding:0}
/* 0.8.3.3: a word under every icon (聲音 / 放大 / 檔案 / 鍵盤 / 設定); the muted speaker says 開聲音 */
.ib .bl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-size:11px;line-height:1.2;white-space:nowrap;color:#fff;
  text-shadow:0 1px 2px #000,0 0 4px #000;pointer-events:none}
.ib .bl.call{color:var(--ac);font-weight:700}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--ac);border-color:var(--ac)}.ib.on svg{stroke:#2a1a1c}
#bar .ib{transition:opacity .4s}
#bar.dim .ib{opacity:.35}

#silent{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100% - 24px);bottom:calc(84px + var(--sb));z-index:4;padding:6px 14px;border-radius:14px;
  background:rgba(0,0,0,.66);font-size:13px;display:none;text-align:center;pointer-events:none}
body.sheet-open #silent{display:none!important}
#badge{position:absolute;left:50%;transform:translateX(-50%);top:calc(6px + var(--st));z-index:4;padding:3px 10px;border-radius:12px;background:rgba(0,0,0,.6);
  font-size:13px;display:none;white-space:nowrap}
#badge.unl{border:1px solid var(--ac);cursor:pointer}
#badge.unl b{color:var(--ac);font-weight:600}
/* 0.8.3: 解除僅觀看 with the password (fixed link) */
#unlIn{width:100%;box-sizing:border-box;margin:10px 0 4px;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:var(--fg);font:500 17px/1.3 system-ui,sans-serif}
#unlErr{min-height:1.2em;color:var(--ac)}
#lockNote{margin-top:6px;text-align:right}
/* 0.8.3 files both ways */
#fileS .fl{list-style:none;margin:6px 0 0;padding:0;max-height:34vh;overflow:auto}
#fileS .fl li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
#fileS .fl .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fileS .fl .st{flex:0 0 auto;opacity:.75;font-variant-numeric:tabular-nums}
#fileS .fl a{color:var(--ac);text-decoration:none}
#fileS .fl a.used{opacity:.45;pointer-events:none}
#fileS progress{width:64px;height:6px;-webkit-appearance:none;appearance:none;border:0;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.18);accent-color:var(--ac)}
#fileS progress::-webkit-progress-bar{background:rgba(255,255,255,.18);border-radius:3px}
#fileS progress::-webkit-progress-value{background:var(--ac);border-radius:3px}
#fileS progress::-moz-progress-bar{background:var(--ac);border-radius:3px}
#upIn{display:none}
.ib.off{opacity:.4;border-style:dashed}  /* 0.8.3.5 files: this page may not send files (looks off; a tap says why) */
/* "sound on" call to action, shown until used */
#cta{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sb));z-index:4;display:none;align-items:center;gap:8px;
  padding:10px 18px;border-radius:24px;border:0;background:var(--ac);color:#2a1a1c;font-weight:600;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#cta svg{width:20px;height:20px;fill:none;stroke:#2a1a1c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* toast */
#toast{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;top:calc(40px + var(--st));z-index:5;max-width:min(92vw,460px);padding:10px 14px;border-radius:12px;
  background:var(--bg);font-size:14px;display:none;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#toast.warn{border:1px solid var(--ac);font-size:15px}
/* 0.8.3.5: the PC browser's bar (a mouse is used): top middle, out of the way until the mouse comes up */
#pcbar{position:absolute;left:50%;top:0;transform:translate(-50%,-100%);z-index:6;display:none;transition:transform .18s ease-out;padding-bottom:10px}
body.pcui #pcbar{display:block}
body.pcui #pcbar.show{transform:translate(-50%,0)}
#pcbarIn{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;padding:6px 8px;margin-top:6px;background:rgba(30,20,22,.92);border:1px solid rgba(245,167,167,.35);
  border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.45);white-space:nowrap}
#pcbarTab{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:56px;height:5px;border-radius:3px;background:var(--ac);opacity:.75}
body.pcui #pcbar.show #pcbarTab{opacity:0}
#pcbar .grp{display:flex;gap:4px;align-items:center}
#pcbar .grp+.grp{border-left:1px solid rgba(255,255,255,.14);padding-left:6px;margin-left:2px}
#pcbar button{border:1px solid transparent;background:none;color:var(--fg);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px}
#pcbar button:hover{background:rgba(245,167,167,.16);border-color:rgba(245,167,167,.35)}
#pcbar button.on{background:var(--ac);color:#2a1a1c;font-weight:600}
#pcbar button.off{opacity:.45;border:1px dashed rgba(255,255,255,.35)}  /* rel-0835 files: the PC bar's 檔案 looks off like the phone's (hover / a click says why) */
#pcbar button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pcbar .pk{font:600 12px/1.2 ui-monospace,Consolas,monospace;border-color:rgba(255,255,255,.16)}
body.pcui #pad{cursor:default}
body.game #pcbar{display:none!important}
/* (d) a PC's browser: everything is on the top bar; the phone's round buttons go */
body.pcui #bar{display:none}
#pbMons{display:flex;gap:2px}
#pbMons button{font-variant-numeric:tabular-nums;padding:5px 8px}
@media (max-width:1100px){#pcbar .pl{display:none}#pcbar button{padding:5px 7px}}
@media (max-width:760px){#pgKeys .pk:nth-child(n+4){display:none}}
/* rel-0835: the bar never wider than the window (en / ja labels and two or more screens were cut at both ends at
   1280 px): fitPcbar() drops the labels (c1), then the rarer keys (c2), whatever the window width */
#pcbar.c1 .pl{display:none}#pcbar.c1 button{padding:5px 7px}#pcbar.c2 #pgKeys .pk:nth-child(n+4){display:none}
#pcbar.c3 #pbLockT{display:none}#pcbar.c3 button,#pcbar.c3 #pbMons button{padding:5px 5px}#pcbar.c3 .grp{gap:2px}#pcbar.c3 .grp+.grp{padding-left:4px;margin-left:0}#pcbar.c3 #pcbarIn{gap:3px;padding:5px 6px}
#lockHint{position:absolute;left:50%;top:calc(10px + var(--st));transform:translateX(-50%);z-index:6;display:none;pointer-events:none;padding:4px 12px;border-radius:12px;
  background:rgba(30,20,22,.8);border:1px solid rgba(245,167,167,.45);font-size:12px;color:var(--fg);white-space:nowrap;transition:all .25s}
#lockHint.big{top:40%;padding:14px 22px;font-size:16px;border-radius:14px;background:rgba(30,20,22,.92);white-space:normal;max-width:min(90vw,460px);text-align:center}
body.pcui #toast{top:calc(64px + var(--st))}
/* 0.8.3.5 (b): where a PC keyboard's input method composes (Chinese / Japanese / Korean); invisible,
   placed at the mouse so the candidate window shows there */
#ime{position:absolute;left:0;top:0;width:2px;height:20px;opacity:0;border:0;padding:0;margin:0;resize:none;overflow:hidden;font-size:16px;z-index:1;
  pointer-events:none;color:transparent;background:transparent;caret-color:transparent}
/* 0.8.3.5 ②: the PC pointer in 觸控板 mode, big and high-contrast (the real one is ~3 px on a phone at 3440 wide) */
#tcur{position:absolute;z-index:3;left:0;top:0;width:48px;height:48px;margin:-13px 0 0 -13px;pointer-events:none;display:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
#tcur svg{width:48px;height:48px;display:block}
/* 0.8.4 游標: the PC pointer's own picture, drawn here (left out of the video). The inverting part (the I-beam)
   is a sibling of the video's box, blended with it (difference = the screen inverted, as on the PC). */
#pcurC,#pcurI{position:absolute;z-index:3;left:0;top:0;pointer-events:none;display:none;transform-origin:0 0;image-rendering:auto}
#pcurC{filter:drop-shadow(0 0 1px rgba(0,0,0,.55)) drop-shadow(0 1px 2px rgba(0,0,0,.45))}
#pcurI{mix-blend-mode:difference}
/* 0.8.3.5 ②: which mode the phone is in, said once (and again after taps far from the pointer) */
#modeHint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sb));z-index:7;width:min(92vw,420px);background:var(--bg);
  border:1px solid var(--ac);border-radius:14px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:none}
#mhT{font-size:16px;font-weight:600;color:var(--ac);margin-bottom:6px}
#mhS{font-size:14px;line-height:1.5;opacity:.9}
#modeHint .btnrow{padding-top:10px}
#modeHint .btn{background:var(--ac);color:#2a1a1c;border:0;font-weight:600}
#modeHint .btn.alt{background:rgba(255,255,255,.08);color:var(--fg);border:1px solid rgba(255,255,255,.25)}
body.sheet-open #modeHint,body.hint-open #cta{display:none!important}
/* #8: a card for a PC's browser (the keyboard lock refused), under the bar */
#pcCard{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + var(--st));z-index:7;width:min(92vw,460px);background:var(--bg);
  border:1px solid var(--ac);border-radius:14px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:none}
#pcT{font-size:16px;font-weight:600;color:var(--ac);margin-bottom:6px}
#pcS{font-size:14px;line-height:1.5;opacity:.9}
#pcCard .btnrow{padding-top:10px}
#pcCard .btn{background:var(--ac);color:#2a1a1c;border:0;font-weight:600}
#pcCard .btn.alt{background:rgba(255,255,255,.08);color:var(--fg);border:1px solid rgba(255,255,255,.25)}
#bar{gap:10px}
/* sheets (settings, help, keyboard) */
.sheet{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);max-height:calc(100% - 12px - var(--st));overflow:auto;
  background:var(--bg);border-radius:16px 16px 0 0;padding:14px 16px calc(14px + var(--sb));display:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  box-shadow:0 -6px 30px rgba(0,0,0,.45)}
body.sheet-open #cta{display:none!important}
.sheet h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h3 button{border:0;background:none;color:var(--ac);font-size:15px;padding:6px 4px;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.row>label,.row>.lbl{flex:1 1 140px;min-width:0}
.sub{display:block;font-size:12px;opacity:.65;margin-top:2px}
.sub.warnSub{opacity:.95;color:var(--ac)}  /* 0.8.3.7: 每秒畫面 capped by this screen: said in the accent colour */
.seg{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:10px;overflow:hidden;flex:0 1 auto;max-width:100%}
.seg button{border:0;background:none;padding:7px 11px;font-size:14px;white-space:nowrap;min-width:0}
.seg button.on{background:var(--ac);color:#2a1a1c;font-weight:600}
input[type=range]{flex:1 1 160px;accent-color:var(--ac);min-width:120px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,.25);position:relative;flex:0 0 46px;margin:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.sw:checked{background:var(--ac)}.sw:checked::after{left:21px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px}
.btn{flex:1 1 auto;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;font-size:15px;white-space:nowrap}
.btn.warn{border-color:#e57373;color:#ffb3b3}
#help ul{margin:6px 0 10px;padding-left:20px}#help li{margin:4px 0}
#help a{color:var(--ac)}
/* keyboard panel */
#kb input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0}
#kbhint{font-size:13px;opacity:.75;margin-bottom:8px}
#keys{display:flex;flex-wrap:wrap;gap:6px}
#keys button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);border-radius:9px;padding:8px 10px;font-size:14px;white-space:nowrap;min-width:44px}
#keys button.on{background:var(--ac);color:#2a1a1c;border-color:var(--ac)}
#keys .sep{flex-basis:100%;height:0}
#keys button.warnk{border-color:#e57373;color:#ffb3b3}
#keys #bClip{border-color:var(--ac);color:var(--ac)}
/* 0.8.4 自訂快捷鍵 (keyboard panel): the 主帳號's own buttons, kept on the PC. Self-contained block. */
#keys button,#ck button{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#keys button.rep,#ck button.rep{background:var(--ac);color:#2a1a1c}
#ck{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
#ckHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#ckHead b{font-size:14px}
#ckCnt{font-size:12px;opacity:.65;font-variant-numeric:tabular-nums}
#ckHead .sp{flex:1 1 0}
#ckHead button,#ckEd .ckb{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:var(--fg);border-radius:9px;padding:6px 11px;font-size:14px;white-space:nowrap;min-width:44px}
#ckHead button.on,#ckEd .ckb.on{background:var(--ac);color:#2a1a1c;border-color:var(--ac);font-weight:600}
#ckHead button:disabled{opacity:.4}
#ckList{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ckc{display:flex;align-items:stretch;min-width:0;max-width:100%;border:1px solid rgba(245,167,167,.5);background:rgba(245,167,167,.1);border-radius:9px;overflow:hidden}
.ckc .ck{border:0;background:none;color:var(--fg);padding:6px 10px;font-size:14px;line-height:1.2;text-align:center;min-width:44px;min-height:40px;max-width:100%;overflow:hidden}
.ckc .ck .cn{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckc .ck .cc{display:block;font:11px/1.2 ui-monospace,Consolas,monospace;opacity:.7;white-space:nowrap}
.ckc .ckh,.ckc .ckx{display:none;border:0;background:rgba(255,255,255,.06);color:var(--ac);padding:0 8px;font-size:16px;min-width:32px}
.ckc .ckh{touch-action:none;cursor:grab}
#ck.edit .ckc .ckh,#ck.edit .ckc .ckx{display:block}
.ckc.dropB{box-shadow:-3px 0 0 var(--ac)}.ckc.dropA{box-shadow:3px 0 0 var(--ac)}
.ckc.drag{opacity:.55;transform:scale(1.04);box-shadow:0 4px 14px rgba(0,0,0,.5);position:relative;z-index:2}
#ckNote{font-size:12px;opacity:.7;margin-top:6px}
#ckEmpty{font-size:13px;opacity:.7;padding:6px 0}
#ckEd{display:none;margin-top:10px;padding:10px;border:1px solid var(--ac);border-radius:12px;background:rgba(245,167,167,.06)}
#ckEd .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
#ckEd .r:first-child{margin-top:0}
#ckEd label.l{font-size:13px;opacity:.8;flex:0 0 auto}
#ckEd input[type=text],#ckEd select{flex:1 1 120px;min-width:0;max-width:100%;font-size:16px;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:7px 9px}
#ckEd select option,#ckEd select optgroup{background:#2a1c1f;color:var(--fg)}
#kb #ckName{position:static;width:auto;height:auto;opacity:1;flex:1 1 120px;min-width:0;border:1px solid rgba(255,255,255,.22);padding:7px 9px}
#ckPrev{font:600 14px ui-monospace,Consolas,monospace;color:var(--ac);min-height:20px;overflow-wrap:anywhere}
#ckRecHint{font-size:12px;opacity:.75}
#ckEd .ckb.rec{border-color:#e57373;color:#ffb3b3}
#ckEd .btnrow{padding-top:10px}
@media (max-height:500px){
  #ck{margin-top:6px;padding-top:6px}#ckEd{padding:6px 8px}#ckEd .r{margin-top:5px}
  #ckEd .btnrow{padding-top:6px}#ckRecHint{display:none}
  .ckc .ck{min-height:34px;padding:4px 8px}
}
#ckSave{background:var(--ac);color:#2a1a1c;border-color:var(--ac);font-weight:600}
textarea{width:100%;margin-top:6px;font:16px/1.4 inherit;font-family:inherit;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);
  border-radius:10px;padding:8px;resize:vertical;-webkit-user-select:text;user-select:text;touch-action:auto}
/* predicted PC pointer (O7): shown while the PC has not caught up with the finger yet */
#cur{position:absolute;z-index:3;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid #fff;background:rgba(245,167,167,.55);
  box-shadow:0 0 0 1px rgba(0,0,0,.6);pointer-events:none;display:none}

/* tap feedback: a ring where the click happened */
.rip{position:absolute;z-index:3;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--ac);pointer-events:none;
  animation:rip .38s ease-out forwards}
.rip.r2{border-style:double;border-width:6px}
@keyframes rip{from{transform:scale(.3);opacity:.95}to{transform:scale(1.35);opacity:0}}
#ask{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:24px}
#askBox{background:var(--bg);border-radius:14px;padding:18px;max-width:360px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#askT{font-size:16px;margin-bottom:14px}
/* full-page message (connecting / waiting for the PC / errors) */
#msg{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;
  background:var(--bg);padding:24px calc(24px + var(--sr)) calc(24px + var(--sb)) calc(24px + var(--sl))}
#msg.hide{display:none}
#msg.over{background:rgba(0,0,0,.72)}
#msgT{font-size:19px;font-weight:600;max-width:520px}
#msgS{font-size:14px;opacity:.75;max-width:520px;white-space:pre-line}
.nw{white-space:nowrap}
#msgB{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#msgB .btn{flex:0 1 auto;background:var(--ac);color:#2a1a1c;border:0;font-weight:600;min-width:120px}
#msgB .btn.alt{background:rgba(255,255,255,.1);color:var(--fg)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--ac);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#app{font-size:13px;opacity:.55}
/* the browser only starts the picture after a tap (iPhone Low Power Mode / some in-app browsers):
   asked for at once, while the connection is still being set up */
#tapHint{position:absolute;left:0;right:0;bottom:calc(18px + var(--sb));z-index:10;display:none;justify-content:center;pointer-events:none}
#tapHint span{padding:12px 20px;border-radius:24px;background:var(--ac);color:#2a1a1c;font-weight:600;font-size:16px;box-shadow:0 4px 16px rgba(0,0,0,.4);
  max-width:calc(100% - 32px);text-align:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
#rowSens input{flex:1 1 100%}
#rowVol input{flex:1 1 100%}
#rowMutePc.off label{opacity:.55}
#volV{font-variant-numeric:tabular-nums;opacity:.8;min-width:3.5em;text-align:right}
/* phone sideways: tighter rows so the settings fit without scrolling */
@media (max-height:500px){.sheet{padding-top:8px}.sheet h3{margin-bottom:2px}.row{padding:4px 0}.sub{display:none}.sub.warnSub{display:block}.btnrow{padding-top:6px}.btn{padding:7px 12px}
  #keys button{padding:6px 9px}#kbhint{display:none}#rowSens input{flex:1 1 200px}}
</style>

<!-- 0.8.3.7: the login page's little cast: 投投 (the cloud) with a phone, a monitor and a mouse. Their bodies act (drop in, squash, lean after the cursor, turn their
     backs on the password, a phone bending like a banana to peek, a crowd that sulks, sleeps or cheers), each with its own face. Pure front end: it looks at events
     (focus, empty / not empty, the show-password button, the pending request, the kind of the answer) and never at the password; it changes nothing the server
     says or counts. Self-contained: this style + this script. One requestAnimationFrame loop exists only while something moves. -->
<style id="palsCss">
#pals{flex:0 0 auto;width:min(92vw,43vh,560px);margin:0 0 6px;pointer-events:none;-webkit-user-select:none;user-select:none}
#pals svg{display:block;width:100%;height:auto;overflow:visible}
/* wide window: the cast stands to the left of the form */
@media (min-width:700px) and (orientation:landscape){#pals{position:absolute;right:calc(50% + 190px);top:50%;transform:translateY(-50%);margin:0;width:min(520px,calc(50vw - 205px),78vh)}}
@media (max-height:640px) and (orientation:portrait){#pals{width:min(62vw,205px)}}
@media (max-height:520px) and (orientation:portrait){#pals{width:min(40vw,118px)}}
@media (max-height:400px) and (orientation:portrait){#pals{display:none}}
@media (max-height:300px){#pals{display:none}}
#pals .up,#pals .dn,#pals .sq,#pals .xx,#pals .lid,#pals .brow,#pals .m,#pals .sweat,#pals .zzz,#pals .note,#pals .blush2,#pals .tear,#pals .bk,#pals .wet{display:none}
#pals .open,#pals .hl,#pals .sc{transform-box:fill-box;transform-origin:50% 50%;transition:transform .07s}
#pals.blink .open,#pals.blink .hl,#pals.blink .sc{transform:scaleY(.08)!important}
/* eyes */
#pals .k-up .open,#pals .k-up .hl,#pals .k-up .sc,#pals .k-dn .open,#pals .k-dn .hl,#pals .k-dn .sc,#pals .k-sq .open,#pals .k-sq .hl,#pals .k-sq .sc,#pals .k-squint .open,#pals .k-squint .hl,#pals .k-squint .sc{display:none}
#pals .k-up .up,#pals .k-squint .up{display:inline}#pals .k-squint .up{transform:scaleY(.55)}
#pals .k-dn .dn{display:inline}#pals .k-sq .sq{display:inline}
#pals .k-lid .lid{display:inline}
#pals .k-wide .open,#pals .k-wide .sc{transform:scale(1.22)}
#pals .k-dead .open{transform:scale(.5)}#pals .k-dead .hl{display:none}
#pals .b-1 .brow{display:inline}
/* mouths */
#pals .e-smile .m-smile,#pals .e-flat .m-flat,#pals .e-o .m-o,#pals .e-sad .m-sad,#pals .e-happy .m-happy,#pals .e-grin .m-grin,#pals .e-whistle .m-o,#pals .e-pout .m-pout,#pals .e-bite .m-bite,#pals .e-smirk .m-smirk,#pals .e-wail .m-wail{display:inline}
#pals .e-whistle .note{display:inline}
#pals .x-sweat .sweat,#pals .x-z .zzz,#pals .x-blush .blush2,#pals .x-tear .tear,#pals .x-tear .wet{display:inline}
#pals .back .face,#pals .back .scr,#pals .back .hand{display:none}#pals .back .bk{display:inline}
#pals .x-off .scr{fill:#6A4752}
/* little finite animations (they end by themselves) */
#pals .tremble .sh{animation:palsTrem .07s linear 16 alternate}
#pals .x-z .zzz{animation:palsZ 2.4s ease-in-out 7 both}
#pals .x-tear .drop{animation:palsDrop 1s ease-in 6 both}
#pals .note{animation:palsNote 1.1s ease-out 3 both}
@keyframes palsTrem{from{transform:translateX(-1.6px)}to{transform:translateX(1.6px)}}
@keyframes palsZ{0%{opacity:0;transform:translateY(4px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
@keyframes palsDrop{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
@keyframes palsNote{0%{opacity:0;transform:translateY(4px)}25%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@keyframes palsShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}35%{transform:translateX(8px)}55%{transform:translateX(-6px)}75%{transform:translateX(4px)}}

  #pals *{transition:none!important;animation:none!important}
  #passIn.shake,#userIn.shake{animation:none!important}
}
</style>
<script>
'use strict';
// PALS: the hooks the login code calls (wait / fail / happy). Everything else is its own business.
window.PALS = (() => {
  const $ = id => document.getElementById(id);
  const pass = $('pass'), passIn = $('passIn'), userIn = $('userIn'), eye = $('pwEye'), go_ = $('passGo');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const INK = '#3A2830', GY = 282, W400 = 400;
  const f1 = n => Math.round(n * 10) / 10, f2 = n => Math.round(n * 100) / 100;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---- faces: one eye style per character, one shared vocabulary of expressions ----
  const eyeSvg = (c, sx) => {
    const r = c.r, g = c.gap;
    let open;
    if (c.eye === 'sclera') open = `<circle class="sc" r="${r * 1.45}" fill="#fff" stroke="${INK}" stroke-width="2"/><g class="pg"><circle class="open" r="${r * .72}" fill="${INK}"/><circle class="hl" cx="${-r * .22}" cy="${-r * .25}" r="${r * .22}" fill="#fff"/></g>`;
    else if (c.eye === 'oval') open = `<g class="pg"><ellipse class="open" rx="${r * .95}" ry="${r * 1.25}" fill="${INK}"/><circle class="hl" cx="${-r * .35}" cy="${-r * .5}" r="${r * .42}" fill="#fff"/><circle class="hl" cx="${r * .3}" cy="${r * .55}" r="${r * .2}" fill="#fff" opacity=".9"/></g><ellipse class="wet" rx="${r * 1.25}" ry="${r * 1.55}" fill="none" stroke="#fff" stroke-width="1.6" opacity=".8"/>`;
    else open = `<g class="pg"><circle class="open" r="${r}" fill="${INK}"/><circle class="hl" cx="${-r * .3}" cy="${-r * .35}" r="${r * .3}" fill="#fff"/></g>`;
    const e = c.eye === 'sclera' ? r * 1.45 : r * 1.2;
    return `<g class="eye" transform="translate(${sx * g} 0)">${open}` +
      (c.eye === 'dotlid' ? `<rect class="lid" x="${-r - 2}" y="${-r - 2}" width="${2 * r + 4}" height="${r + 2}" fill="${c.screen}"/><path class="lid" d="M${-r - 2} 0H${r + 2}" stroke="${INK}" stroke-width="2"/>` : '') +
      `<path class="up" d="M${-e} ${e * .45}Q0 ${-e * 1.5} ${e} ${e * .45}" fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round"/>` +
      `<path class="dn" d="M${-e} ${-e * .25}Q0 ${e * 1.2} ${e} ${-e * .25}" fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round"/>` +
      `<path class="sq" d="M${-e} 0H${e}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>` +
      `<path class="brow" transform="scale(${-sx} 1)" d="M${-e * 1.15} ${-e * 1.35}L${e * 1.1} ${-e * 2.1}" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>` +
      `<path class="tear" d="M${-e * .6} ${e * .95}Q${-e * .6} ${e * 2.1} 0 ${e * 2.1}" fill="none" stroke="#9FD4EE" stroke-width="3" stroke-linecap="round" opacity=".9"/><path class="tear drop" d="M${sx * 1} ${e * 1.2}Q${sx * 5} ${e * 2.2} ${sx * 1} ${e * 2.7}Q${sx * -3} ${e * 2.2} ${sx * 1} ${e * 1.2}Z" fill="#BFE3F5" stroke="#8EC9EA" stroke-width="1.2"/></g>`;
  };
  const mouthSvg = c => {
    const w = c.mw, S = `fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"`;
    return `<g transform="translate(0 ${c.my})">` +
      `<path class="m m-smile" d="M${-w} 0Q0 ${w * 1.1} ${w} 0" ${S}/>` +
      `<path class="m m-flat" d="M${-w * .75} 1H${w * .75}" ${S}/>` +
      `<ellipse class="m m-o" cy="2" rx="${w * .4}" ry="${w * .52}" fill="${INK}"/>` +
      `<path class="m m-sad" d="M${-w} 3Q0 ${-w * .9} ${w} 3" ${S}/>` +
      `<path class="m m-pout" d="M${-w * .9} 3Q${-w * .45} -3 0 2Q${w * .45} 7 ${w * .9} 2" ${S}/>` +
      `<path class="m m-smirk" d="M${-w * .8} 2Q${w * .2} 3 ${w * .85} -2.5" ${S}/>` +
      `<path class="m m-bite" d="M${-w * .85} 1.5H${w * .85}" ${S}/><rect class="m m-bite" x="${-w * .6}" y="1.5" width="${w * .5}" height="${w * .55}" rx="1" fill="#fff" stroke="${INK}" stroke-width="1.6"/>` +
      `<path class="m m-happy" d="M${-w * 1.1} -1Q0 ${w * 1.9} ${w * 1.1} -1Z" fill="${INK}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>` +
      `<path class="m m-grin" d="M${-w * 1.35} -2Q0 ${w * 2.1} ${w * 1.35} -2Z" fill="${INK}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path class="m m-grin" d="M${-w * .9} -1H${w * .9}" stroke="#fff" stroke-width="2.4"/>` +
      `<path class="m m-wail" d="M${-w * 1.1} 6Q0 ${-w * 1.5} ${w * 1.1} 6Z" fill="${INK}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>` +
      `<g class="note" transform="translate(${w * 1.7} -2)"><path d="M0 0V-12L7 -9" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/><circle cx="-2.2" cy="0.5" r="2.6" fill="${INK}"/></g></g>`;
  };
  const faceSvg = c => `<g class="face">${c.cheeks ? `<ellipse cx="${-c.gap * 1.4}" cy="${c.my * .75}" rx="${c.r * 1.6}" ry="${c.r}" fill="#FF9AAE" opacity=".55"/><ellipse cx="${c.gap * 1.4}" cy="${c.my * .75}" rx="${c.r * 1.6}" ry="${c.r}" fill="#FF9AAE" opacity=".55"/>` : ''}` +
    `<ellipse class="blush2" cx="${-c.gap * 1.4}" cy="${c.my * .75}" rx="${c.r * 1.9}" ry="${c.r * 1.2}" fill="#FF7A94" opacity=".7"/><ellipse class="blush2" cx="${c.gap * 1.4}" cy="${c.my * .75}" rx="${c.r * 1.9}" ry="${c.r * 1.2}" fill="#FF7A94" opacity=".7"/>` +
    `<g class="eyes">${eyeSvg(c, -1)}${eyeSvg(c, 1)}</g>${mouthSvg(c)}` +
    `<path class="sweat" transform="translate(${c.gap * 2} ${-c.r * 1.2})" d="M0 -9Q6 2 0 7Q-6 2 0 -9Z" fill="#BFE3F5" stroke="#8EC9EA" stroke-width="1.3"/>` +
    `<g class="zzz" transform="translate(${c.gap * 1.5} ${-c.r * 2.2})"><path d="M0 0H8L0 9H8" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/><path transform="translate(10 -9) scale(.7)" d="M0 0H8L0 9H8" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/></g></g>`;
  const handSvg = c => `<ellipse class="hand" rx="${c.hr}" ry="${c.hr * .8}" fill="${c.handCol}"/>`;

  // ---- the cast (viewBox 400 x 300, one ground line at y = 282; back row: phone, middle: monitor, front: 投投 and the mouse) ----
  const C = {
    phone:   {id: 'phone', cx: 165, w: 86, h: 208, tall: true, eye: 'sclera', r: 6.5, gap: 19, my: 17, mw: 8, lean: 9, stretch: 1.05, gmax: 3.6, tvl: 24, fx: 0, fy: 0, hands: false},
    monitor: {id: 'monitor', cx: 262, w: 124, h: 122, eye: 'dotlid', r: 5.5, gap: 18, my: 14, mw: 7, lean: 5, stretch: 1.03, gmax: 3.2, tvl: 34, fx: 262, fy: 200, screen: '#FFF2E6', hands: false},
    toutou:  {id: 'toutou', cx: 92, w: 118, h: 87, eye: 'oval', r: 6.2, gap: 15.8, my: 9, mw: 6.5, lean: 6, stretch: 1.0, gmax: 3.4, tvl: 30, fx: 92, fy: 256.8, cheeks: true, hands: true, hr: 10, handCol: '#FFB3C4'},
    mouse:   {id: 'mouse', cx: 322, w: 96, h: 68, eye: 'dot', r: 5.2, gap: 15, my: 9, mw: 6, lean: 4, stretch: 1.04, gmax: 3.2, tvl: 28, fx: 322, fy: 257, hands: true, hr: 10, handCol: '#D9604A'},
  };
  const ORDER = [C.phone, C.monitor, C.toutou, C.mouse];
  const bodySvg = {
    phone: c => `<path class="body" fill="#E8708A"/><path class="scr" fill="#FFE6EA"/><path class="spk" fill="none" stroke="#B84A63" stroke-width="5" stroke-linecap="round"/>` +
      `<g class="bk"><rect x="${c.cx - 32}" y="112" width="36" height="36" rx="10" fill="#D45A74"/><circle cx="${c.cx - 21}" cy="123" r="6" fill="#B84A63"/><circle cx="${c.cx - 21}" cy="138" r="6" fill="#B84A63"/><circle cx="${c.cx - 8}" cy="130" r="3.4" fill="#F5C2CC"/><circle cx="${c.cx}" cy="212" r="7" fill="#F5C2CC" opacity=".8"/></g>`,
    monitor: () => `<rect x="254" y="250" width="16" height="26" fill="#F0A878"/><rect x="232" y="274" width="60" height="8" rx="4" fill="#F0A878"/><rect x="200" y="160" width="124" height="96" rx="12" fill="#FFC8A2"/><rect class="scr" x="208" y="168" width="108" height="76" rx="7" fill="#FFF2E6"/>` +
      `<g class="bk"><circle cx="262" cy="208" r="9" fill="#F0A878"/><rect x="226" y="236" width="14" height="5" rx="2" fill="#F0A878"/><rect x="246" y="236" width="14" height="5" rx="2" fill="#F0A878"/></g>`,
    toutou: () => `<g transform="translate(${92 - 133 * .72} ${GY - 166 * .72}) scale(.72)"><g fill="url(#palsCloud)"><circle cx="86" cy="112" r="30"/><circle cx="132" cy="90" r="40"/><circle cx="178" cy="114" r="26"/><rect x="54" y="108" width="158" height="58" rx="29"/></g><ellipse cx="116" cy="66" rx="22" ry="12" transform="rotate(-24 116 66)" fill="#fff" opacity=".9"/></g>`,
    mouse: () => `<path d="M370 272C396 274 399 248 385 241" fill="none" stroke="#FF8F7A" stroke-width="5" stroke-linecap="round"/><rect x="316" y="203" width="12" height="24" rx="6" fill="#E5705C"/>` +
      `<path d="M274 282V256C274 228 296 214 322 214C348 214 370 228 370 256V282Z" fill="#FF8F7A"/><path d="M322 226V244" stroke="#E5705C" stroke-width="3" stroke-linecap="round"/>`,
  };
  const markup = `<svg viewBox="0 0 ${W400} 300" aria-hidden="true" focusable="false"><defs><radialGradient id="palsCloud" gradientUnits="userSpaceOnUse" cx="118" cy="70" r="125"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#FBF7F8"/><stop offset="1" stop-color="#E3DAE6"/></radialGradient></defs>` +
    `<ellipse cx="200" cy="284" rx="185" ry="5" fill="#F5A7A7" opacity=".18"/>` +
    ORDER.map(c => `<g class="ch" data-c="${c.id}"><g class="sh">${bodySvg[c.id](c)}${faceSvg(c)}${c.hands ? handSvg(c) + handSvg(c) : ''}</g></g>`).join('') + `</svg>`;
  const box = document.createElement('div');
  box.id = 'pals'; box.innerHTML = markup;
  pass.insertBefore(box, pass.firstChild);
  const svg = box.firstChild;
  const REST = {x: 0, y: 0, rot: 0, skew: 0, sx: 1, sy: 1, turn: 0, bend: 0, kink: 0, gx: 0, gy: 0, ft: 0, o: 1, ex: 0};
  for (const c of ORDER) {
    c.g = svg.querySelector(`.ch[data-c="${c.id}"]`);
    c.face = c.g.querySelector('.face');
    c.pgs = [...c.g.querySelectorAll('.pg')];
    c.hs = [...c.g.querySelectorAll('.hand')];
    c.p = Object.assign({h0x: 0, h0y: 0, ho0: 0, h1x: 0, h1y: 0, ho1: 0}, REST);
    c.tw = {}; c.dirty = true; c.back = false; c.fp = {x: c.fx || c.cx, y: c.fy || 130};
    c.exid = '';
    if (c.tall) { c.bodyP = c.g.querySelector('.body'); c.scrP = c.g.querySelector('.scr'); c.spkP = c.g.querySelector('.spk'); }
  }

  // ---- the engine: tweens on numeric parameters, one requestAnimationFrame loop only while a tween is alive ----
  const E = {
    out: u => 1 - Math.pow(1 - u, 3), in: u => u * u, inout: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2,
    spring: u => 1 - Math.exp(-5.5 * u) * Math.cos(u * Math.PI * 2.4), spring2: u => 1 - Math.exp(-4 * u) * Math.cos(u * Math.PI * 3.2),
    back: u => { const s = 2.2; return 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); },
  };
  let rafId = 0, frames = 0;
  function go(c, props, dur = 300, e = 'spring', delay = 0) {
    for (const k in props) {
      if (reduce.matches || (!dur && !delay)) { c.p[k] = props[k]; delete c.tw[k]; c.dirty = true; }
      else c.tw[k] = {to: props[k], t0: performance.now() + delay, dur, e};
    }
    kick();
  }
  const kick = () => { if (!rafId) rafId = requestAnimationFrame(tick); };
  function tick(now) {
    rafId = 0; frames++;
    let busy = false;
    for (const c of ORDER) {
      for (const k in c.tw) {
        const w = c.tw[k];
        if (now < w.t0) { busy = true; continue; }
        if (w.from === undefined) w.from = c.p[k];
        const u = (now - w.t0) / w.dur;
        if (u >= 1) { c.p[k] = w.to; delete c.tw[k]; } else { c.p[k] = w.from + (w.to - w.from) * E[w.e](u); busy = true; }
        c.dirty = true;
      }
      if (c.dirty) { c.dirty = false; render(c); }
    }
    if (busy) rafId = requestAnimationFrame(tick);
  }
  // the phone's body: a polygon along a centre line that can bend (banana) and kink; the screen follows it
  function phoneGeom(c) {
    const p = c.p, H = c.h, k = p.bend, q = p.kink;
    const pt = t => [c.cx + k * H * .55 * t * t + q * 26 * Math.sin(t * Math.PI * 1.7) * t, GY - H * t * (1 - .2 * Math.abs(k) * t)];
    const ang = t => { const a = pt(Math.min(1, t + .01)), b = pt(Math.max(0, t - .01)); return Math.atan2(a[0] - b[0], -(a[1] - b[1])); };
    const edge = (t, hw, s) => { const [x, y] = pt(t), a = ang(t), w = hw * (1 - .22 * Math.abs(q) * Math.sin(Math.PI * t)); return [x + s * w * Math.cos(a), y + s * w * Math.sin(a)]; };
    const poly = (hw, t0, t1, rt) => {
      const n = 14, L = [], R = [];
      for (let i = 0; i <= n; i++) { const t = t0 + (t1 - t0 - rt) * i / n; L.push(edge(t, hw, -1)); R.push(edge(t, hw, 1)); }
      const lt = edge(t1, hw, -1), rtp = edge(t1, hw, 1), P = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
      const m = a => `${f1(a[0])} ${f1(a[1])}`;
      let d = 'M' + m(L[0]);
      for (let i = 1; i < L.length; i++) d += 'L' + m(L[i]);
      d += `Q${m(lt)} ${m(P(lt, rtp, rt > .05 ? .2 : .12))}L${m(P(lt, rtp, rt > .05 ? .8 : .88))}Q${m(rtp)} ${m(R[R.length - 1])}`;
      for (let i = R.length - 2; i >= 0; i--) d += 'L' + m(R[i]);
      return d + 'Z';
    };
    return {pt, ang, poly};
  }
  function render(c) {
    const p = c.p;
    c.g.setAttribute('transform', `translate(${f1(c.cx + p.x)} ${f1(GY + p.y)}) rotate(${f1(p.rot)}) skewX(${f1(p.skew)}) scale(${f2(p.sx)} ${f2(p.sy)}) translate(${-c.cx} ${-GY})`);
    c.g.style.opacity = p.o;
    for (const g of c.pgs) g.setAttribute('transform', `translate(${f1(p.gx)} ${f1(p.gy)})`);
    const ts = 1 - .8 * Math.abs(p.turn);
    if (c.tall) {
      const G = phoneGeom(c), H = c.h, t = .7;
      c.bodyP.setAttribute('d', G.poly(c.w / 2, 0, 1, .07));
      c.scrP.setAttribute('d', G.poly(35, .096, .923, .05));
      const s0 = G.pt(.968), a0 = G.ang(.968), sc = Math.cos(a0), sn = Math.sin(a0);
      c.spkP.setAttribute('d', `M${f1(s0[0] - 9 * sc)} ${f1(s0[1] - 9 * sn)}L${f1(s0[0] + 9 * sc)} ${f1(s0[1] + 9 * sn)}`);
      const [x, y] = G.pt(t), a = G.ang(t);
      c.fp.x = x; c.fp.y = y;
      c.face.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) rotate(${f1(a * 180 / Math.PI)}) translate(${f1(p.turn * c.tvl)} 0) scale(${f2(ts)} 1) rotate(${f1(p.ft)})`);
    } else {
      c.fp.x = c.fx + p.turn * c.tvl; c.fp.y = c.fy;
      c.face.setAttribute('transform', `translate(${f1(c.fx + p.turn * c.tvl)} ${f1(c.fy)}) rotate(${f1(p.ft)}) scale(${f2(ts)} 1)`);
    }
    if (c.hs.length) c.hs.forEach((h, i) => { h.setAttribute('transform', `translate(${f1(p['h' + i + 'x'])} ${f1(p['h' + i + 'y'])})`); h.style.opacity = p['ho' + i]; });
  }
  // timeline helpers (everything pending is cancelled when the state changes)
  ORDER.forEach(render);
  let tms = [];
  const after = (ms, f) => { if (reduce.matches) f(); else tms.push(setTimeout(f, ms)); };
  const clearSeq = () => { tms.forEach(clearTimeout); tms = []; ORDER.forEach(c => c.g.classList.remove('tremble')); };
  const hands = (c, mode, dur = 280) => {
    if (!c.hands) return;
    const x = c.fx, y = c.fy, g = c.gap, hw = c.w / 2;
    const M = {hide: [x - g, y + 26, 0, x + g, y + 26, 0], cover: [x - g * .72, y + 1, 1, x + g * .72, y + 1, 1], fore: [x - g * .2, y - c.r * 3.2, 1, x + g, y + 26, 0],
      shrug: [x - hw - 8, y + 12, 1, x + hw + 8, y + 12, 1], up: [x - hw - 4, y - 34, 1, x + hw + 4, y - 34, 1]}[mode];
    go(c, {h0x: M[0], h0y: M[1], ho0: M[2], h1x: M[3], h1y: M[4], ho1: M[5]}, dur, 'spring');
  };
  // expressions: id -> [mouth, eyes, brow, extras]
  const X = {
    idle:  {toutou: ['smile', 'open', 0, ''], phone: ['smirk', 'open', 0, ''], monitor: ['flat', 'lid', 0, ''], mouse: ['smile', 'wide', 0, '']},
    watch: {toutou: ['smile', 'open', 0, 'blush'], phone: ['o', 'open', 0, ''], monitor: ['flat', 'open', 0, ''], mouse: ['o', 'wide', 0, '']},
    pw:    {toutou: ['flat', 'dn', 0, ''], phone: ['flat', 'sq', 0, 'sweat'], monitor: ['smirk', 'lid', 0, ''], mouse: ['smile', 'dn', 0, '']},
    peek:  {toutou: ['flat', 'dn', 0, ''], phone: ['o', 'open', 0, ''], monitor: ['flat', 'lid', 1, ''], mouse: ['smile', 'dn', 0, '']},
    pwdone: {phone: ['whistle', 'open', 0, 'sweat']},
    show:  {toutou: ['pout', 'sq', 0, 'sweat'], phone: ['whistle', 'dn', 0, ''], monitor: ['flat', 'dn', 0, ''], mouse: ['smile', 'sq', 0, '']},
    wait:  {toutou: ['pout', 'wide', 0, ''], phone: ['flat', 'open', 0, ''], monitor: ['flat', 'lid', 0, 'sweat'], mouse: ['bite', 'open', 0, 'sweat']},
    sad:   {toutou: ['pout', 'open', 1, 'tear'], phone: ['smirk', 'open', 0, 'sweat'], monitor: ['flat', 'dead', 0, ''], mouse: ['sad', 'open', 1, '']},
    sad3:  {toutou: ['wail', 'dn', 1, 'tear'], phone: ['smirk', 'open', 1, 'sweat'], monitor: ['flat', 'dead', 0, 'sweat'], mouse: ['sad', 'dn', 0, 'sweat']},
    lock:  {toutou: ['pout', 'dn', 0, 'tear z'], phone: ['o', 'dn', 0, 'z'], monitor: ['flat', 'sq', 0, 'z off'], mouse: ['flat', 'dn', 0, 'z']},
    happy: {toutou: ['happy', 'up', 0, 'blush'], phone: ['grin', 'up', 0, ''], monitor: ['smirk', 'lid', 1, ''], mouse: ['happy', 'squint', 0, '']},
    cheer: {monitor: ['smirk', 'up', 0, '']},
    glare: {monitor: ['flat', 'lid', 1, '']},
  };
  const setEx = (c, id, from) => {
    const x = (X[id] && X[id][c.id]) || (X[from] && X[from][c.id]);
    if (!x) return;
    const keep = (c.back ? ' back' : '') + (c.g.classList.contains('tremble') ? ' tremble' : '');
    c.g.setAttribute('class', `ch e-${x[0]} k-${x[1]}${x[2] ? ' b-1' : ''}${x[3] ? ' ' + x[3].split(' ').map(s => 'x-' + s).join(' ') : ''}${keep}`);
    c.exid = `${x[0]} ${x[1]} ${x[2]} ${x[3]}`;
  };
  const exAll = id => ORDER.forEach(c => setEx(c, id, 'idle'));
  const flip = (c, toBack) => {
    if (c.back === toBack) return;
    if (reduce.matches) { c.back = toBack; c.g.classList.toggle('back', toBack); go(c, {sx: 1}, 0); return; }
    go(c, {sx: .05}, 150, 'in');
    after(155, () => { c.back = toBack; c.g.classList.toggle('back', toBack); go(c, {sx: 1}, 420, 'spring'); });
  };
  const fpOf = c => c.fp;
  const pageToVb = pt => { const r = svg.getBoundingClientRect(), s = r.width / W400; return {x: (pt.x - r.left) / s, y: (pt.y - r.top) / s}; };
  const lookAt = (c, pt, dur = 150) => {
    const f = fpOf(c), dx = pt.x - f.x, dy = pt.y - f.y, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 90);
    go(c, {gx: c.gmax * k * dx / d, gy: c.gmax * k * dy / d}, dur, 'out');
  };
  const rest = (dur = 420, keepBack) => ORDER.forEach(c => { if (!keepBack && c.back) { c.back = false; c.g.classList.remove('back'); } go(c, REST, dur, 'spring'); hands(c, 'hide'); });
  const fieldPt = () => { const f = userIn.offsetParent !== null && document.activeElement === userIn ? userIn : passIn, r = f.getBoundingClientRect(); return pageToVb({x: r.left + r.width / 2, y: r.top + r.height / 2}); };
  const goPt = () => { const r = go_.getBoundingClientRect(); return pageToVb({x: r.left + r.width / 2, y: r.top + r.height / 2}); };
  function aim(pt, near) {  // the whole body leans after a point (feet stay put), the eyes follow it

  // ---- the state ----
  let active = false, st = 'idle', ptr = null, tBlink = 0, tHold = 0, tTheater = 0, introRunning = false, introDone = false, fails = 0, peekDone = false, peekOn = false, lastMove = 0, tWait = 0;
  const cls = () => { box.className = 'st-' + st + (peekOn ? ' peek' : ''); };
  function enter(s) {  // a new state: cancel what was going on, then the pose
    clearSeq(); clearTimeout(tHold); clearTimeout(tWait);
    if (introRunning) { introRunning = false; ORDER.forEach(c => { c.p.y = 0; c.p.o = 1; c.p.sx = 1; c.p.sy = 1; c.tw = {}; c.dirty = true; }); }

  }
  const base = () => {
    const a = document.activeElement;
    if (pass.classList.contains('pw') && passIn.type === 'text') return 'show';
    if (a === userIn) return 'user';

    return 'idle';

  function pose(s) {

      theater();
    } else if (s === 'user') {
      rest(); exAll('watch'); aim(fieldPt(), true);
    } else if (s === 'pw') {
      rest(); exAll('pw');
      const T = C.toutou, P = C.phone, M = C.monitor, S = C.mouse;
      hands(T, 'cover'); go(T, {rot: -4, sy: .98}, 360);
      go(M, {turn: .75, rot: 4, gx: 3}, 420); go(S, {turn: 1, rot: 6}, 420);
      go(P, {turn: -.45, rot: -3, ft: 0}, 420); P.g.classList.add('tremble');

      rest(420, true); exAll('show');
      const T = C.toutou, P = C.phone, M = C.monitor, S = C.mouse;
      hands(T, 'cover'); go(T, {rot: -9, y: 2}, 400); go(S, {turn: 1, rot: 8}, 420);
      go(P, {rot: -14}, 200); after(200, () => go(P, {rot: -2}, 500)); flip(P, true);
      after(70, () => flip(M, true));
      after(0, () => { T.g.classList.add('tremble'); });
    }
  }
  function peek() {  // the phone bends over like a banana to look at the dots, the monitor glares, the phone springs back and whistles
    if (st !== 'pw') return;
    const P = C.phone, M = C.monitor;
    peekOn = true; cls();
    setEx(P, 'peek'); P.g.classList.remove('tremble');
    go(P, {turn: 0, bend: -.9, rot: 0, ft: 28, gx: 0, gy: 3.4}, 640, 'back');
    after(700, () => { setEx(M, 'glare'); go(M, {turn: 0, rot: -6, gx: -3.2}, 260, 'spring'); lookAt(M, fpOf(P)); });
    after(1400, () => {
      peekOn = false; cls();
      setEx(P, 'pwdone'); go(P, {bend: 0, ft: 0, turn: -.45, rot: -3, gx: 3, gy: -3}, 560, 'spring2');
      setEx(M, 'pw'); go(M, {turn: .75, rot: 4, gx: 3}, 420);
    });
  }
  function wait() {  // the request is out and slow: everybody holds their breath
    enter('wait'); box.className = 'st-wait';
    const T = C.toutou, P = C.phone, M = C.monitor, S = C.mouse, pt = goPt();
    rest(260); exAll('wait');
    go(T, {sy: .82, sx: 1.1}, 420); T.g.classList.add('tremble');
    go(P, {sy: 1.06, sx: .97}, 420); lookAt(P, pt);
    lookAt(S, pt); go(S, {rot: -2}, 300);
    let k = 0;
    const dart = () => { go(M, {gx: k++ % 2 ? -4 : 4, gy: 0}, 120, 'out'); after(520, dart); };
    dart();
    const wob = () => { go(S, {rot: k % 2 ? 2.5 : -2.5}, 380, 'inout'); after(420, wob); };
    wob();
    const retre = () => { T.g.classList.remove('tremble'); void T.g.getBoundingClientRect(); T.g.classList.add('tremble'); after(2600, retre); };
    after(2600, retre);
  }
  function sad(n) {
    enter('sad');
    const T = C.toutou, P = C.phone, M = C.monitor, S = C.mouse, m = Math.min(1.8, 1 + .3 * (n - 1)), big = n >= 3;
    rest(220); exAll(big ? 'sad3' : 'sad');
    go(P, {kink: 1 * m, rot: -6 * m, ft: 10 * m, sy: .95}, 520, 'spring2');
    // the phone rolls its eyes, the monitor glances at it with dead eyes
    [[-3, -3], [0, -3.6], [3, -3], [3.4, 1], [0, 2]].forEach((g, i) => after(160 + i * 130, () => go(P, {gx: g[0], gy: g[1]}, 110, 'out')));
    go(M, {sy: .97, rot: 3}, 400); after(120, () => lookAt(M, fpOf(P), 220));
    go(T, {sy: .92, y: 3, ft: -6}, 420, 'spring');
    [-4, 4, -3, 2, 0].forEach((r, i) => after(250 + i * 160, () => go(T, {rot: r * m}, 150, 'inout')));
    go(S, {sy: .78, sx: 1.12}, 520, 'spring'); after(1100, () => go(S, {sy: .86, sx: 1.07}, 700, 'out'));
    if (big) { hands(T, 'cover'); T.g.classList.add('tremble'); hands(S, 'shrug'); go(S, {rot: -4}, 300); }

    tHold = setTimeout(() => { if (st === 'sad') enterBase(); }, 2500 + 300 * (n - 1));
  }
  function lock() {
    enter('lock'); rest(200); exAll('lock');
    const T = C.toutou, P = C.phone, M = C.monitor, S = C.mouse;
    go(T, {sy: .7, sx: 1.18}, 600, 'spring'); go(P, {bend: .6, ft: 18, sy: .92}, 800, 'spring'); go(M, {sy: .82, sx: 1.04, rot: 3}, 600, 'spring'); go(S, {sy: .56, sx: 1.25}, 600, 'spring');
  }
  function happy() {
    enter('happy'); exAll('happy');
    const T = C.toutou, P = C.phone, M = C.monitor, S = C.mouse;
    rest(160);
    const jump = (c, d, h) => { go(c, {y: -h, sy: 1.12, sx: .92}, 200, 'out', d); after(d + 210, () => { go(c, {y: 0}, 300, 'in'); }); after(d + 500, () => { c.p.sx = 1.22; c.p.sy = .8; c.dirty = true; go(c, {sx: 1, sy: 1}, 480, 'spring'); kick(); }); };
    // 投投: spins; the monitor first only raises one brow, then gets pulled in
    jump(T, 0, 46); go(T, {rot: 360}, 560, 'out'); after(700, () => { T.p.rot = 0; T.dirty = true; });
    jump(P, 40, 38); go(P, {bend: .05}, 300);
    after(150, () => setEx(M, 'cheer')); jump(M, 170, 30);
    jump(S, 80, 34);
    after(210, () => { go(P, {x: 9}, 160, 'out'); go(M, {x: -9}, 160, 'out'); });
    after(480, () => { go(P, {x: 0}, 300); go(M, {x: 0}, 300); });
  }
  function enterBase() { const b = base(); enter(b); pose(b); }
  function intro() {  // everybody drops in from the top, one after the other, and squashes on landing
    introRunning = true; kick();
    [C.phone, C.monitor, C.toutou, C.mouse].forEach((c, i) => {
      c.tw = {}; c.p.y = -320; c.p.o = 0; c.p.rot = (i % 2 ? 1 : -1) * 18; c.p.sy = 1.1; c.p.sx = .94; c.dirty = true;
      const d = 160 * i + 40;
      after(d, () => { c.p.o = 1; setEx(c, 'watch'); go(c, {y: 0, rot: 0}, 300, 'in'); });
      after(d + 300, () => { c.p.sx = 1.3; c.p.sy = .66; c.dirty = true; setEx(c, 'idle'); go(c, {sx: 1, sy: 1}, 560, 'spring'); kick(); });
    });
    after(160 * 3 + 40 + 900, () => { introRunning = false; pose(st); });
  }
  // little shows while nothing happens
  function theater() {
    clearTimeout(tTheater);
    if (!active || reduce.matches) return;
    tTheater = setTimeout(() => {
      if (!active || st !== 'idle' || introRunning || document.hidden) return theater();
      const P = C.phone, M = C.monitor, T = C.toutou, S = C.mouse, pick = Math.floor(Math.random() * 5);
      if (pick === 0) {  // two look at each other
        const a = ORDER[Math.floor(Math.random() * 4)], b = ORDER[(ORDER.indexOf(a) + 1 + Math.floor(Math.random() * 3)) % 4];
        lookAt(a, fpOf(b)); lookAt(b, fpOf(a)); go(a, {rot: (b.cx > a.cx ? 1 : -1) * 4}, 300); go(b, {rot: (a.cx > b.cx ? 1 : -1) * 4}, 300);

      } else if (pick === 2) {  // 投投 floats up a little
        go(T, {y: -20, sy: 1.04}, 560, 'inout'); tms.push(setTimeout(() => go(T, {y: 0, sy: 1}, 800, 'spring'), 700));
      } else if (pick === 3) {  // the mouse hops
        go(S, {y: -16, sy: 1.1, sx: .94}, 140, 'out'); tms.push(setTimeout(() => { go(S, {y: 0}, 360, 'spring'); S.p.sx = 1.15; S.p.sy = .86; S.dirty = true; go(S, {sx: 1, sy: 1}, 400, 'spring'); }, 150));
      } else {  // the monitor whistles
        setEx(M, 'idle'); M.g.classList.remove('e-flat'); M.g.classList.add('e-whistle'); go(M, {rot: -2}, 300, 'inout'); tms.push(setTimeout(() => { setEx(M, 'idle'); go(M, {rot: 0}, 300); }, 1500));
      }
      theater();
    }, 3600 + Math.random() * 3600);
  }
  function blinkLoop() {
    clearTimeout(tBlink);
    if (!active || reduce.matches || document.hidden) return;
    tBlink = setTimeout(() => {
      if (st !== 'happy' && st !== 'lock') { box.classList.add('blink'); setTimeout(() => box.classList.remove('blink'), 130); }

  }
  function wake(on) {
    if (on === active) return;
    active = on;
    if (on) {
      st = base(); cls(); exAll('idle');
      if (!introDone && !reduce.matches) { introDone = true; intro(); } else pose(st);
      blinkLoop();
    } else { clearTimeout(tBlink); clearTimeout(tHold); clearTimeout(tTheater); clearTimeout(tWait); clearSeq(); }
  }
  new MutationObserver(() => wake(pass.style.display === 'flex')).observe(pass, {attributes: true, attributeFilter: ['style']});
  document.addEventListener('visibilitychange', blinkLoop);
  const move = e => {
    if (!active) return;
    ptr = [e.clientX, e.clientY];
    const now = performance.now();
    if (st === 'idle' && !introRunning && !reduce.matches && now - lastMove > 40) { lastMove = now; aim(pageToVb({x: e.clientX, y: e.clientY}), false); }
  };
  addEventListener('pointermove', move, {passive: true});
  addEventListener('pointerdown', move, {passive: true});
  addEventListener('resize', () => { if (active && st === 'user') aim(fieldPt(), true); });
  const sticky = () => st === 'sad' || st === 'lock' || st === 'happy' || st === 'wait';
  pass.addEventListener('focusin', () => { if (introRunning) { st = base(); cls(); return; } if (!sticky()) { const b = base(); if (b !== st) { enter(b); pose(b); } else if (b === 'user') aim(fieldPt(), true); } });
  pass.addEventListener('focusout', () => setTimeout(() => { if (introRunning) { st = base(); cls(); return; } if (active && !sticky()) { const b = base(); if (b !== st) { enter(b); pose(b); } } }, 0));
  // each key: the cast reacts by its own way; only "is there anything in it" decides the state (never what, never how many)
  function keyReact() {
    const T = C.toutou, P = C.phone, M = C.monitor, S = C.mouse;
    if (st === 'user') {
      go(P, {sy: 1.1}, 80, 'out'); after(90, () => go(P, {sy: P.stretch}, 320, 'spring'));
      go(M, {y: -3}, 70, 'out', 40); after(120, () => go(M, {y: 0}, 260, 'spring'));
      go(T, {y: -6}, 80, 'out', 20); after(110, () => go(T, {y: 0}, 300, 'spring'));
      go(S, {y: -10, sy: 1.08}, 90, 'out', 60); after(160, () => go(S, {y: 0, sy: S.stretch}, 320, 'spring'));
    } else if (st === 'pw') {
      go(S, {rot: 10}, 70, 'out'); after(80, () => go(S, {rot: 6}, 260, 'spring'));

      if (!peekOn) { P.g.classList.remove('tremble'); void P.g.getBoundingClientRect(); P.g.classList.add('tremble'); }
    }
  }
  pass.addEventListener('input', e => {
    if (e.target !== passIn && e.target !== userIn) return;
    passIn.classList.remove('shake'); userIn.classList.remove('shake'); pass.classList.remove('lock');
    if (sticky()) { clearTimeout(tWait); }
    const b = e.target === userIn ? 'user' : base();
    if (b !== st) { enter(b); pose(b); }
    keyReact();
  });
  // 顯示密碼 / 隱藏密碼: runs after the page's own handler has switched the type
  eye.addEventListener('click', () => setTimeout(() => {
    if (!active) return;
    const b = base();
    if (b === 'show') { enter('show'); pose('show'); }
    else { const backs = ORDER.filter(c => c.back); enter(b); pose(b); backs.forEach(c => { c.back = true; c.g.classList.add('back'); flip(c, false); }); }
  }, 0));
  const shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); el.addEventListener('animationend', () => el.classList.remove('shake'), {once: true}); };
  return {
    state: () => st + (peekOn ? '+peek' : ''),
    frames: () => frames,
    busy: () => !!rafId,
    faces: () => ORDER.map(c => c.exid),
    faceCheck: () => ORDER.map(c => { const r = c.face.getBoundingClientRect(); return {id: c.id, x: r.left, y: r.top, w: r.width, h: r.height, eyes: [...c.g.querySelectorAll('.eye')].map(e => { const b = e.getBoundingClientRect(); return [b.left + b.width / 2, b.top + b.height / 2]; })}; }),
    // the request is out; if the answer is quick (under 150 ms) nothing is shown at all
    wait() { if (!active) return; clearTimeout(tWait); tWait = setTimeout(() => { if (active && !sticky()) wait(); else if (active && st === 'wait') { /* already */ } }, 150); },
    // a wrong answer (j = the server's answer; only its kind is read)
    fail(j) {
      clearTimeout(tWait);
      if (!active) return;
      const locked = !!(j && j.locked);
      fails++;
      if (locked) { lock(); pass.classList.add('lock'); return; }
      pass.classList.remove('lock');
      sad(fails);
      shake(passIn); if (userIn.offsetParent !== null) shake(userIn);
    },
    // success: the face and the jump for at most 200 ms, then the caller goes on
    happy() {
      clearTimeout(tWait);
      fails = 0;
      if (!active) return Promise.resolve();
      pass.classList.remove('lock'); happy();
      return new Promise(r => setTimeout(r, reduce.matches ? 0 : 200));
    },
  };
})();

// ---- 0.8.4 自動畫質: the PC moves the picture along its ladder from the network's state (the phone's
// receiver reports, its own queues: auto_quality.h); it starts low (the first picture sooner) and climbs
// while the link stays clean. 0.8.3.6 did this here, and only ever downwards from the preset chosen: under a
// clogged downlink this page's own messages were stuck behind the video (measured 16 s), the PC never heard.
// The page adds what only it knows: it shows far fewer frames than the PC sends (a phone that cannot decode
// that much), 2 s in a row -> {"t":"rx","short":true}. A preset chosen by hand is kept as it is.
S.autoRung = -1;
const adapt = {
  last: null, short: 0,
  reset() { this.last = null; this.short = 0; },
  async tick() {
    if (!pc || S.state !== 'connected' || document.hidden) { this.last = null; return; }
    let inb = null;
    try { (await pc.getStats()).forEach(s => { if (s.type === 'inbound-rtp' && s.kind === 'video') inb = s; }); } catch { return; }
    if (!inb) return;
    const now = {recv: inb.packetsReceived || 0, lost: inb.packetsLost || 0, frames: inb.framesDecoded || 0, t: performance.now()};
    const prev = this.last; this.last = now;
    if (!prev) return;
    const dRecv = now.recv - prev.recv, dLost = Math.max(0, now.lost - prev.lost);
    const loss = (dRecv + dLost) > 50 ? dLost / (dRecv + dLost) : 0;
    const shown = (now.frames - prev.frames) * 1000 / (now.t - prev.t);
    const sent = S.srv ? S.srv.fps : 0;
    const short = sent > 5 && shown < sent * 0.65;
    S.adapt = {loss: +(loss * 100).toFixed(1), shown: +shown.toFixed(1), sent: +(sent || 0).toFixed(1), rtt: S.rtt, rung: S.autoRung, q: curQ,
               rttPc: S.srv && S.srv.rttPc, lossPc: S.srv && S.srv.lossPc};
    this.short = short ? this.short + 1 : 0;
    if (prefs.q < 0 && this.short >= 2) { this.short = 0; send({t: 'rx', short: true, shown: S.adapt.shown, sent: S.adapt.sent}); }
  },
};

  if (m.q < fromQ) { S.autoWentDown = true; toast(tf('autoDown', t('q' + m.q)), 4000); }
  else if (m.q > fromQ && S.autoWentDown) toast(tf('autoUp', t('q' + m.q)), 3000);
}
